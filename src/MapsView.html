<script>
/** Maps JavaScript API is optional; never invent a road route or ETA. */
KSB.loadMaps=async function(){if(window.google?.maps)return true;const key=KSB.state.config?.mapsKey;if(!key)return false;if(KSB.mapsPromise)return KSB.mapsPromise;KSB.mapsPromise=new Promise(resolve=>{const callback='ksbMapLoaded'+Date.now();window[callback]=()=>{resolve(true);delete window[callback];};const script=document.createElement('script');script.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&callback='+callback;script.async=true;script.onerror=()=>resolve(false);document.head.appendChild(script);setTimeout(()=>resolve(!!window.google?.maps),12000);});return KSB.mapsPromise;};
KSB.showMap=async function(target,a,b){const el=document.getElementById(target);if(!el)return;const latA=Number(a?.lat||a?.pickup_lat),lngA=Number(a?.lng||a?.pickup_lng),latB=Number(b?.lat||b?.dropoff_lat),lngB=Number(b?.lng||b?.dropoff_lng);if(![latA,lngA,latB,lngB].every(Number.isFinite)||latA===0||lngA===0||latB===0||lngB===0){el.innerHTML='<div>Koordinat belum tersedia. Simpan titik GPS alamat terlebih dahulu.</div>';return;}const url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(latA+','+lngA)+'&destination='+encodeURIComponent(latB+','+lngB);el.innerHTML='<div>Memuat rute Google Maps…</div>';let ok=await KSB.loadMaps();if(!document.getElementById(target))return;if(!ok){el.innerHTML=`<div style="padding:20px;text-align:center">📍 Peta belum diaktifkan.<br><a href="${url}" target="_blank" rel="noopener">Buka rute di Google Maps</a><br><small>Jarak dan ETA tidak diperkirakan tanpa data API.</small></div>`;return;}
 try{const origin={lat:latA,lng:lngA},destination={lat:latB,lng:lngB},map=new google.maps.Map(el,{zoom:12,center:origin,disableDefaultUI:true,zoomControl:true}),service=new google.maps.DirectionsService(),renderer=new google.maps.DirectionsRenderer({map,suppressMarkers:false});service.route({origin,destination,travelMode:google.maps.TravelMode.DRIVING},(result,status)=>{if(status==='OK'){renderer.setDirections(result);}else{new google.maps.Marker({position:origin,map,label:'A'});new google.maps.Marker({position:destination,map,label:'B'});map.fitBounds(new google.maps.LatLngBounds(origin,destination));KSB.toast('Rute tidak tersedia. Marker menunjukkan titik lokasi saja.',true);}});}catch(e){el.innerHTML=`<div><a href="${url}" target="_blank" rel="noopener">Buka navigasi eksternal</a></div>`;}
};
KSB.afterRender=async function(){const s=KSB.state;if(s.view==='track'&&s.args.id){try{const d=await KSB.call('delivery.track',{deliveryId:s.args.id});const x=d.delivery;await KSB.showMap('tracking-map',{lat:x.pickup_lat,lng:x.pickup_lng},{lat:x.dropoff_lat,lng:x.dropoff_lng});}catch(e){console.warn('Map:',e.message);}}};
</script>
