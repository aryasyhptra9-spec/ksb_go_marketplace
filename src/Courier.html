<script>
KSB.courier=async function(view,args){if(!KSB.state.user?.roles.includes('COURIER'))return KSB.accountView();
 if(view==='dashboard'){let d=await KSB.call('courier.dashboard');return KSB.page('🛵 KSB RUTE — Kurir',`<div class="card"><div class="flex between"><div class="flex"><span class="avatar">🚚</span><div><strong>${KSB.h(KSB.state.user.name)}</strong><div class="small muted">Kurir Terverifikasi</div></div></div><button class="btn ${d.courier.online==='TRUE'?'':'secondary'}" data-action="courierOnline" data-online="${d.courier.online==='TRUE'?'false':'true'}">${d.courier.online==='TRUE'?'🟢 Online':'⚪ Offline'}</button></div></div><div class="grid grid-2 stats-grid" style="margin-top:14px"><div class="stat"><div class="title">Order Tersedia</div><div class="value">${d.available}</div></div><div class="stat"><div class="title">Sedang Dikirim</div><div class="value">${d.active}</div></div><div class="stat"><div class="title">Selesai</div><div class="value">${d.delivered}</div></div><div class="stat"><div class="title">Saldo Hak Kurir</div><div class="value">${KSB.rup(d.payable)}</div></div></div><div class="notice">Anda dapat mengambil order baru setelah pickup order sebelumnya. Tidak ada batas maksimal order dalam perjalanan.</div><div class="grid grid-2">${KSB.btn('📦 Ambil Order','courierAvailable','','')}${KSB.btn('🛵 Pengiriman Saya','courierMy','','outline')}${KSB.btn('💳 COD & Invoice','courierFinance','','outline')}</div><h3 class="section-title">Kewajiban COD Belum Disetor</h3><div class="card"><div class="price">${KSB.rup(d.codOutstanding)}</div><div class="small muted">Nilai ini bukan pendapatan platform baru. Setoran harus diverifikasi admin.</div></div>`);}
 if(view==='available'){let d;try{d=await KSB.call('courier.available',{page:KSB.state.page});}catch(e){return KSB.page('Order Tersedia',`<div class="notice warn">${KSB.h(e.message)}</div>${KSB.btn('Kembali ke dashboard','courierDashboard')}`);}return KSB.page('Order Tersedia',d.items.length?d.items.map(o=>`<div class="card" style="margin-bottom:11px"><div class="flex between"><b>${KSB.h(o.id)}</b><span class="pill blue">${KSB.h(o.type)}</span></div><div class="kv"><span>Asal</span><span>${KSB.h(o.from_district)}</span></div><div class="kv"><span>Tujuan</span><span>${KSB.h(o.to_district)}</span></div><div class="kv"><span>Ongkos Kirim</span><span>${KSB.rup(o.shipping_fee)}</span></div><button class="btn full" data-action="courierClaim" data-id="${KSB.h(o.id)}">Ambil Order</button></div>`).join(''):KSB.empty('Belum ada order tersedia','Order akan muncul setelah pembayaran/syarat dispatch terpenuhi.'));}
 if(view==='my'){let d=await KSB.call('courier.my',{page:KSB.state.page});return KSB.page('Pengiriman Saya',d.items.length?d.items.map(o=>`<div class="card" style="margin-bottom:11px"><div class="flex between"><strong>${KSB.h(o.id)}</strong>${KSB.status(o.status)}</div><div class="kv"><span>Tujuan</span><span>${KSB.h(o.to_district)}</span></div><div class="kv"><span>Ongkir</span><span>${KSB.rup(o.shipping_fee)}</span></div>${KSB.btn('Buka Pengiriman','courierDelivery',o.id,'')}</div>`).join(''):KSB.empty('Belum ada tugas','Buka Order Tersedia dan klaim pengiriman.'));}
 if(view==='delivery'){let d=await KSB.call('courier.my',{size:40}),o=d.items.find(i=>i.id===args.id);if(!o)return KSB.empty('Pengiriman tidak ditemukan','Kembali ke menu Pengiriman Saya');let steps={CLAIMED:['HEADING_TO_PICKUP','PICKED_UP'],HEADING_TO_PICKUP:['PICKED_UP'],PICKED_UP:['IN_DELIVERY'],IN_DELIVERY:['DELIVERED','FAILED_DELIVERY']},allowed=steps[o.status]||[];return KSB.page('Proses Pengiriman',`<div class="aside-split"><div class="grid"><div class="card"><div class="flex between"><strong>${KSB.h(o.id)}</strong>${KSB.status(o.status)}</div><div class="timeline">${['CLAIMED','HEADING_TO_PICKUP','PICKED_UP','IN_DELIVERY','DELIVERED'].map(x=>`<div>${KSB.h(x)}</div>`).join('')}</div><div class="kv"><span>Pickup</span><span>${KSB.h(o.pickup_address)}</span></div><div class="kv"><span>Tujuan</span><span>${KSB.h(o.dropoff_address)}</span></div><div class="kv"><span>COD Diterima</span><span>${KSB.rup(o.cod_due||0)}</span></div><div class="btn-group">${KSB.btn('🗺 Navigasi Pickup','courierNavigate',o.id+':pickup','outline')}${KSB.btn('🗺 Navigasi Tujuan','courierNavigate',o.id+':dropoff','outline')}</div>${o.sender_phone?`<a class="btn small secondary" href="https://wa.me/${KSB.h(String(o.sender_phone).replace(/\D/g,'').replace(/^0/,'62'))}" target="_blank" rel="noopener">Hubungi Pengirim</a>`:''}${o.recipient_phone?`<a class="btn small secondary" href="https://wa.me/${KSB.h(String(o.recipient_phone).replace(/\D/g,'').replace(/^0/,'62'))}" target="_blank" rel="noopener">💬 WhatsApp Pembeli — Minta Share Location</a>`:''}</div></div><div class="card"><h3>Perbarui Status</h3><p class="small muted">Berhenti di tempat aman sebelum menggunakan aplikasi.</p>${allowed.length?`<form data-form="courierUpdate"><input type="hidden" name="deliveryId" value="${KSB.h(o.id)}">${KSB.select('status','Status Berikutnya',allowed.map(x=>({id:x,name:x})))}<div class="field"><label>Foto bukti pickup/delivery (wajib untuk kedua status)</label><input name="photo" type="file" accept="image/jpeg,image/png"></div>${o.payment_method==='COD'?`${KSB.field('codAmount','Uang COD diterima (Rp)','number',o.cod_due||0,false,'min="0"')}<label class="flex"><input class="check" name="codCollected" type="checkbox"> Saya sudah menerima uang COD sesuai tagihan.</label>`:''}<button class="btn full">Simpan Status</button></form>`:'<div class="notice">Pengiriman ini tidak memiliki transisi status biasa. Hubungi admin untuk sengketa atau retur.</div>'}</div></div>`);}
 if(view==='finance'){let f=await KSB.call('finance.mine',{role:'COURIER'});return KSB.page('Saldo, COD & Invoice',`<div class="grid grid-2"><div class="stat"><div class="title">Saldo Hak Kurir</div><div class="value">${KSB.rup(f.payable)}</div></div><div class="stat"><div class="title">COD Belum Disetor</div><div class="value">${KSB.rup(f.codOutstanding)}</div></div></div><div class="notice warn">Komisi yang telah dipotong dari ongkir tidak ditagihkan dua kali. Setoran COD tercatat saat pembayaran diverifikasi admin.</div>${KSB.btn('🏦 Atur rekening pencairan kurir','courierPayout','','outline')}${KSB.btn('📋 Ajukan pencairan per order','courierClaims','','outline')}<h3 class="section-title">Tagihan dan Invoice</h3><div class="card">${f.invoices.length?f.invoices.map(i=>KSB.cardRow(i.id,`${i.period_start}–${i.period_end} · ${i.status} · ${KSB.rup(i.balance)}`,KSB.btn('PDF','downloadInvoice',i.id))).join(''):KSB.empty('Belum ada invoice')}</div><h3 class="section-title">Settlement</h3><div class="card">${f.settlements.length?f.settlements.map(x=>KSB.cardRow(KSB.rup(x.amount),x.bank_reference,KSB.status(x.status))).join(''):KSB.empty('Belum ada settlement')}</div>`);}
 if(view==='claims')return KSB.manualClaimsView('COURIER');
 if(view==='payout')return KSB.partnerBankView('COURIER');
 if(view==='account')return KSB.accountView();if(view==='order')return KSB.buyer('order',args);return KSB.empty('Halaman kurir tidak ditemukan');
};
KSB.actions.courierClaims=async()=>KSB.goto('claims');
KSB.actions.courierPayout=async()=>KSB.goto('payout');
KSB.actions.courierDashboard=async()=>KSB.goto('dashboard');KSB.actions.courierAvailable=async()=>KSB.goto('available');KSB.actions.courierMy=async()=>KSB.goto('my');KSB.actions.courierFinance=async()=>KSB.goto('finance');KSB.actions.courierDelivery=async el=>KSB.goto('delivery',{id:el.dataset.id});
KSB.actions.courierOnline=async el=>KSB.run(async()=>{await KSB.call('courier.online',{online:el.dataset.online==='true'});await KSB.refresh();});
KSB.actions.courierClaim=async el=>KSB.run(async()=>{let c=await KSB.call('courier.claim',{deliveryId:el.dataset.id});KSB.toast('Order berhasil diklaim.');await KSB.goto('delivery',{id:c.id});if(c.buyerWhatsAppUrl)KSB.modal('Chat Pembeli via WhatsApp',`<p>Order berhasil diambil. Gunakan WhatsApp untuk meminta pembeli membagikan lokasi pengantaran.</p><a class="btn full" href="${KSB.h(c.buyerWhatsAppUrl)}" target="_blank" rel="noopener noreferrer">Buka WhatsApp Pembeli</a>`);});
KSB.actions.courierNavigate=async el=>KSB.run(async()=>{const [id,mode]=el.dataset.id.split(':'),rows=(await KSB.call('courier.my',{size:40})).items,d=rows.find(x=>x.id===id),lat=Number(mode==='pickup'?d.pickup_lat:d.dropoff_lat),lng=Number(mode==='pickup'?d.pickup_lng:d.dropoff_lng);if(!Number.isFinite(lat)||!Number.isFinite(lng)||!lat||!lng)throw Error('Koordinat belum tersedia.');window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(lat+','+lng),'_blank','noopener');});
KSB.forms.courierUpdate=async form=>KSB.run(async()=>{let data=Object.fromEntries(new FormData(form)),status=data.status,att=null;if(status==='PICKED_UP'||status==='DELIVERED'){let file=form.elements.photo.files[0];if(!file)throw Error('Wajib upload bukti foto untuk status '+status);att=await KSB.upload(file,'DELIVERY',data.deliveryId);}await KSB.call('courier.status',{deliveryId:data.deliveryId,status,attachmentId:att?.id||'',codAmount:Number(data.codAmount||0),codCollected:!!data.codCollected});KSB.toast('Status pengiriman diperbarui.');await KSB.goto('delivery',{id:data.deliveryId});});
// Diagnostic marker; courier API authorization remains enforced by the server.
window.KSB_COURIER_MODULE_OK=Boolean(KSB.actions && typeof KSB.actions.courierClaim==='function');
window.KSB_COURIER_MODULE_VERSION='17.2';
</script>
