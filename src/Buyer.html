<script>
/* WhatsApp link helper is defined once in App.html (V14). */
KSB.productCard=function(p){return `<article class="card product-card"><button data-action="product" data-id="${KSB.h(p.id)}" aria-label="Detail ${KSB.h(p.name)}">${p.image?`<img class="product-thumb" src="${KSB.h(p.image)}" alt="${KSB.h(p.name)}" loading="lazy" referrerpolicy="no-referrer">`:'<div class="product-thumb">🛍️</div>'}<div class="product-body"><div class="product-title">${KSB.h(p.name)}</div><div class="price">${KSB.rup(p.price)}</div><div class="small muted">${KSB.h(p.store_name)}</div><div class="tiny muted">Stok: ${KSB.h(p.stock)}</div></div></button></article>`;};
KSB.accountView=function(){let s=KSB.state,u=s.user;return KSB.page('Akun Saya',u?`<div class="card"><div class="flex"><span class="avatar">👤</span><div><strong>${KSB.h(u.name)}</strong><div class="small muted">${KSB.h(u.email)}</div></div></div><div class="section-title">Ubah profil</div><form data-form="profile">${KSB.field('name','Nama lengkap','text',u.name,true)}${KSB.field('phone','Nomor WhatsApp','tel',u.phone||'',false)}<button class="btn full">Simpan Profil</button></form></div><h3 class="section-title">Pilih dashboard</h3><div class="grid grid-2">${['BUYER','SELLER','COURIER','ADMIN'].filter(r=>u.roles.includes(r)).map(r=>`<button class="btn ${r===s.role?'':'secondary'}" data-action="role" data-role="${r}">${r}</button>`).join('')}</div><h3 class="section-title">Menjadi mitra KSB</h3><div class="grid grid-2">${!u.roles.includes('SELLER')?KSB.btn('Daftar Seller','applyRole','','outline').replace('data-id=""','data-role="SELLER"'):''}${!u.roles.includes('COURIER')?KSB.btn('Daftar Kurir','applyRole','','outline').replace('data-id=""','data-role="COURIER"'):''}</div><div class="section-title">Pengaturan</div><div class="grid">${KSB.btn('📍 Alamat Saya','goAddress','','outline')}${KSB.btn('💳 Pembayaran','goPayments','','outline')}${KSB.btn('🚚 Kirim Paket','goParcel','','outline')}<button class="btn danger" data-action="logout">Keluar</button></div>`:`<div class="card"><h3>Selamat datang di KSB GO</h3><p class="muted">Akses keranjang, transaksi, seller, dan kurir dengan masuk melalui akun Google.</p><div id="google-login-slot"></div></div><h3 class="section-title">Apa yang bisa dilakukan?</h3><div class="grid grid-2"><div class="card">🛍️ Belanja lokal</div><div class="card">🛵 Kirim paket antarkecamatan</div></div>`);};
KSB.buyer=async function(view,args){const s=KSB.state;
 if(view==='home'||view==='categories'){const q=args.q||'',district=args.district||'',category=args.category||'';let c=await KSB.call('catalog',{q,district,category,page:s.page,size:24});s.categories=c.categories;const categories=c.categories;return `<div class="grid" style="gap:14px"><form class="search" data-form="search"><span>🔍</span><input type="search" name="q" placeholder="Cari produk, toko, atau kategori" value="${KSB.h(q)}"><button class="btn small" aria-label="Cari">Cari</button></form>${view==='home'?`<div class="hero"><span class="pill">Produk Lokal Sumbawa Barat</span><h2>Belanja dekat, kirim cepat.</h2><p>Dukung UMKM dan toko lokal melalui satu aplikasi.</p><button class="btn secondary small" data-action="goParcel">🚚 KSB RUTE</button></div>`:''}<div class="category-strip">${categories.slice(0,8).map((c,i)=>`<button class="category-item" data-action="category" data-id="${KSB.h(c.id)}"><span class="category-icon">${['🍜','🛒','🌾','💻','👗','🏠','🐝','▦'][i]}</span>${KSB.h(c.name)}</button>`).join('')}</div><div class="flex wrap">${KSB.select('district','Filter kecamatan',[{id:'',name:'Semua Kecamatan'},...KSB.districtOptions()],district,false).replace('name="district"','name="district" data-filter="district"')}<button class="btn secondary small" data-action="clearFilters">Reset filter</button></div></div><div class="section-title">${view==='home'?'Pilihan Produk Lokal':'Semua Produk'} <span class="small muted">${c.products.total} produk</span></div>${c.products.items.length?`<div class="product-grid">${c.products.items.map(KSB.productCard).join('')}</div>`:KSB.empty('Produk belum ditemukan','Coba kecamatan, kategori, atau kata kunci lain.')}${c.products.hasMore?'<div class="footer-action"><button class="btn full" data-action="loadMore">Lihat halaman berikutnya →</button></div>':''}`;}
 if(view==='product'){let p=await KSB.call('product.detail',{id:args.id});return `${KSB.page('Detail Produk',`<div class="aside-split"><div class="grid"><div class="card" style="padding:0;overflow:hidden">${p.images.length?`<img style="width:100%;max-height:400px;object-fit:cover" src="${KSB.h(p.images[0])}" alt="${KSB.h(p.name)}">`:'<div class="product-thumb" style="max-height:380px">🛍️</div>'}</div><div class="card"><span class="pill">Produk Lokal</span><h2>${KSB.h(p.name)}</h2><div class="price" style="font-size:24px">${KSB.rup(p.price)}</div><p class="muted">Stok ${KSB.h(p.stock)} · ${KSB.h(p.store.name)}</p><p>${KSB.h(p.description||'Belum ada deskripsi produk.')}</p><div class="field"><label>Jumlah pembelian</label><input id="product-qty" type="number" min="1" max="${p.stock}" value="1"></div><div class="grid grid-2"><button class="btn outline" data-action="addCart" data-id="${KSB.h(p.id)}">🛒 + Keranjang</button><button class="btn" data-action="buyNow" data-id="${KSB.h(p.id)}">Beli Sekarang</button></div></div></div><div class="card"><h3>🏪 ${KSB.h(p.store.name)}</h3><p class="small muted">${KSB.h(p.store.address)}</p><p class="small">Tarif pengiriman dihitung kembali sebelum checkout.</p>${p.store.whatsapp?`<a class="btn outline full" target="_blank" rel="noopener noreferrer" href="${KSB.h(KSB.waLink(p.store.whatsapp,'Halo '+p.store.name+', saya ingin bertanya tentang '+p.name+' di KSB GO.'))}">💬 Chat Toko via WhatsApp</a>`:'<p class="small muted">Toko belum menambahkan nomor WhatsApp.</p>'}</div>`)} `;}
 if(view==='cart'){if(!KSB.needLogin())return KSB.accountView();let cart=await KSB.call('cart.get');s.cart=cart;if(!s.cartSelectionInitialized){cart.items.forEach(i=>s.selectedItems.add(i.id));s.cartSelectionInitialized=true;}[...s.selectedItems].forEach(id=>{if(!cart.items.some(x=>x.id===id))s.selectedItems.delete(id);});return KSB.page('Keranjang Saya',cart.items.length?`<div class="aside-split"><div class="card"><div class="flex between"><strong>Pilih produk</strong><button class="btn small secondary" data-action="selectAll">Pilih Semua</button></div>${cart.items.map(i=>`<div class="row-item"><input class="check" type="checkbox" data-select-item="${KSB.h(i.id)}" ${s.selectedItems.has(i.id)?'checked':''}><div class="info"><strong>${KSB.h(i.name)}</strong><div class="tiny muted">${KSB.h(i.store_name)}</div><div class="price">${KSB.rup(i.price)}</div><div class="stepper"><button data-action="cartQty" data-id="${KSB.h(i.id)}" data-delta="-1">−</button>${i.quantity}<button data-action="cartQty" data-id="${KSB.h(i.id)}" data-delta="1">+</button><button class="btn danger small" data-action="removeCart" data-id="${KSB.h(i.id)}">Hapus</button></div></div></div>`).join('')}</div><div class="card"><h3>Ringkasan Keranjang</h3><div class="kv"><span>Subtotal</span><span>${KSB.rup(cart.total)}</span></div><p class="small muted">Ongkir dan biaya layanan dihitung berdasarkan alamat.</p><button class="btn full" data-action="checkoutPage">Checkout (${s.selectedItems.size})</button></div></div>`:KSB.empty('Keranjang kosong','Cari produk lokal dan tambahkan ke keranjang.',KSB.btn('Belanja Sekarang','goHome','','outline')));}
 if(view==='address'){if(!KSB.needLogin())return KSB.accountView();let addresses=await KSB.call('address.list');return KSB.page('Alamat Pengiriman',`<div class="aside-split"><div class="card"><h3>Alamat Tersimpan</h3>${addresses.length?addresses.map(a=>KSB.cardRow(a.label,a.recipient+' · '+a.address,KSB.btn('Ubah','editAddress',a.id,'outline'))).join(''):KSB.empty('Belum ada alamat')}</div><div class="card"><h3 id="address-form-title">Tambah Alamat</h3><form data-form="address"><input type="hidden" name="id" value="">${KSB.field('label','Label Alamat','text','Rumah',true)}${KSB.field('recipient','Nama Penerima','text','',true)}${KSB.field('phone','Telepon Penerima','tel','',true)}${KSB.select('district_id','Kecamatan',KSB.districtOptions())}${KSB.field('address','Alamat Lengkap','text','',true)}${KSB.field('lat','Latitude (opsional)','number','',false,'step="any"')}${KSB.field('lng','Longitude (opsional)','number','',false,'step="any"')}<div class="help">Untuk memilih koordinat, gunakan Google Maps di halaman KSB RUTE saat API sudah aktif.</div><div class="btn-group"><button class="btn secondary" type="button" data-action="useGPS">📍 Ambil GPS Saya</button><button class="btn" type="submit">Simpan Alamat</button></div></form></div></div>`);}
 if(view==='checkout'){if(!KSB.needLogin())return KSB.accountView();let cart=await KSB.call('cart.get'),items=cart.items.filter(x=>s.selectedItems.has(x.id)),addresses=await KSB.call('address.list');s.checkoutItems=items;if(!items.length)return KSB.empty('Tidak ada produk dipilih','Kembali ke keranjang.',KSB.btn('Keranjang','goCart'));if(!addresses.length)return KSB.page('Checkout',KSB.empty('Alamat belum ada','Simpan alamat penerima sebelum checkout.',KSB.btn('Tambah alamat','goAddress','','outline')));let sum=items.reduce((x,i)=>x+i.line_total,0);return KSB.page('Checkout',`<div class="aside-split"><form class="card" data-form="checkout"><div class="pill">1 Alamat → 2 Pengiriman → 3 Pembayaran</div>${KSB.select('addressId','Kirim ke alamat',addresses.map(a=>({id:a.id,name:a.label+' — '+a.recipient+' ('+a.address+')'})))}${KSB.select('service','Layanan', [{id:'REGULAR',name:'Reguler'},{id:'EXPRESS',name:'Express'},{id:'INTERDISTRICT',name:'Antar Kecamatan'}])}${KSB.select('paymentMethod','Pembayaran',s.config.manualTransferOnly?[{id:'TRANSFER',name:'Transfer ke rekening resmi KSB GO'}]:s.config.marketplacePrepaidOnly?[...(s.config.paymentRoute==='XENDIT_TEST'?[{id:'GATEWAY',name:'Gateway (simulasi Xendit TEST)'}]:[]),{id:'TRANSFER',name:'Transfer KSB GO (manual)'}]:[{id:'TRANSFER',name:'Transfer KSB GO'},{id:'COD',name:'COD (jika diizinkan admin)'}])}${KSB.field('voucherCode','Kode voucher (opsional)')}<label class="flex" style="min-height:44px"><input class="check" type="checkbox" name="acceptZoneTariff" required> Saya menyetujui tarif zona apabila Routes API tidak tersedia.</label><label class="flex"><input class="check" type="checkbox" name="whatsappConsent" required> Saya setuju nomor WhatsApp penerima dibagikan kepada kurir yang secara sah mengklaim order ini untuk koordinasi pengiriman.</label><div class="notice warn">Pastikan admin telah mengaktifkan Routes API atau menetapkan tarif zona. Checkout akan menghitung ulang seluruh nominal di server.</div><button class="btn full" ${s.config.manualTransferOnly&&!s.config.checkoutEnabled?'disabled title="Checkout transfer belum diaktifkan oleh admin"':''}>Buat Pesanan</button>${s.config.manualTransferOnly&&!s.config.checkoutEnabled?'<p class="small muted">Checkout dinonaktifkan sampai rekening bisnis, keamanan dan aturan refund diverifikasi.</p>':''}</form><div class="card"><h3>Rincian Pesanan</h3>${items.map(i=>KSB.cardRow(i.name,i.store_name+' × '+i.quantity,KSB.rup(i.line_total))).join('')}<div class="kv"><span>Subtotal</span><span>${KSB.rup(sum)}</span></div><p class="muted small">Ongkir, voucher, dan biaya layanan belum termasuk; nominal final dikonfirmasi backend setelah pesanan berhasil dibuat.</p></div></div>`);}
 if(view==='orders'){if(!KSB.needLogin())return KSB.accountView();let data=await KSB.call('order.my',{page:s.page});return KSB.page('Pesanan Saya',data.items.length?data.items.map(o=>`<div class="card" style="margin-bottom:10px"><div class="flex between"><strong>${KSB.h(o.id)}</strong>${KSB.status(o.status)}</div><div class="small muted">${KSB.date(o.created_at)}</div><div class="kv"><span>Total</span><span>${KSB.rup(o.grand_total)}</span></div><div class="btn-group">${KSB.btn('Detail & Lacak','orderDetail',o.id)}${o.status==='PENDING_PAYMENT'?KSB.btn('Batalkan','cancelOrder',o.id,'danger'):''}</div></div>`).join(''):KSB.empty('Belum ada pesanan','Mulai belanja di toko lokal.'));}
 if(view==='order'){if(!KSB.needLogin())return KSB.accountView();const d=await KSB.call('order.detail',{id:args.id}),o=d.order;return KSB.page('Rincian Pesanan',`<div class="aside-split"><div class="grid"><div class="card"><div class="flex between"><strong>${KSB.h(o.id)}</strong>${KSB.status(o.status)}</div><div class="kv"><span>Metode</span><span>${KSB.h(o.payment_method)}</span></div><div class="kv"><span>Status pembayaran</span><span>${KSB.status(o.payment_status)}</span></div><div class="kv"><span>Subtotal</span><span>${KSB.rup(o.subtotal)}</span></div><div class="kv"><span>Diskon</span><span>−${KSB.rup(o.discount)}</span></div><div class="kv"><span>Ongkir</span><span>${KSB.rup(o.shipping_total)}</span></div><div class="kv"><span>Biaya layanan</span><span>${KSB.rup(o.buyer_fee)}</span></div><div class="kv strong"><span>Total</span><span>${KSB.rup(o.grand_total)}</span></div></div><div class="card"><h3>Item Pesanan</h3>${d.items.map(x=>KSB.cardRow(x.name,'Jumlah '+x.quantity,KSB.rup(x.line_total))).join('')||'<p>Pengiriman paket tanpa produk.</p>'}</div>${d.sellerOrders.length?`<div class="card"><h3>Hubungi Toko</h3>${d.sellerOrders.map(x=>`<div class="row-item"><div class="info"><strong>${KSB.h(x.store_name)}</strong></div>${x.store_whatsapp?`<a class="btn small outline" href="${KSB.h(KSB.waLink(x.store_whatsapp,'Halo '+x.store_name+', saya bertanya tentang pesanan '+x.id+' di KSB GO.'))}" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>`:'<span class="small muted">WhatsApp belum ada</span>'}</div>`).join('')}</div>`:''}</div><div class="grid"><div class="card"><h3>Pengiriman</h3>${d.deliveries.map(x=>`<div class="row-item"><div class="info"><strong>${KSB.h(x.id)}</strong><div>${KSB.status(x.status)}</div><div class="small muted">${KSB.h(x.dropoff_address)}</div>${x.status==='DELIVERED'&&!x.buyer_received&&o.payment_status==='PAID'?`<div class="notice warn">Kurir sudah menandai pengiriman selesai. Konfirmasi hanya jika barang benar-benar diterima dan sesuai.</div>${KSB.btn('✅ Pesanan Diterima','confirmBuyerReceiptV16',x.id)}`:x.buyer_received?'<div class="notice">✅ Penerimaan barang sudah dikonfirmasi Pembeli.</div>':''}${KSB.btn('Lacak Paket','track',x.id)}</div></div>`).join('')}</div>${o.payment_status==='PAID'&&['CONFIRMED','PROCESSING','READY','DISPUTED'].includes(o.status)?`<div class="card"><h3>Pengajuan Pengembalian Dana</h3><p class="small muted">Untuk pesanan belum diambil kurir. Refund dilakukan melalui verifikasi admin dan mutasi bank.</p>${KSB.btn('Ajukan Refund','requestRefundV15',o.id,'outline')}</div>`:''}${o.payment_method==='GATEWAY'?`<div class="card"><h3>Pembayaran melalui Gateway (TEST)</h3><p class="small muted">Pembayaran belum sah sampai diverifikasi ke server penyedia, bukan berdasarkan halaman kembali.</p>${d.gatewaySession&&d.gatewaySession.checkout_url?`<a class="btn full" target="_blank" rel="noopener noreferrer" href="${KSB.h(d.gatewaySession.checkout_url)}">Lanjutkan Pembayaran Test</a>`:''}${['PAID','VERIFIED'].includes(o.payment_status)?'<p class="notice">Pembayaran dikonfirmasi.</p>':KSB.btn('Buat / buka checkout test','gatewayStart',o.id)+ ' '+ KSB.btn('Periksa pembayaran','gatewayCheck',o.id)}</div>`:''}${o.payment_method==='TRANSFER'?`<div class="card"><h3>Transfer Bank KSB GO</h3><p><strong>${KSB.h(s.config.bankName||'Belum diatur')}</strong><br>${KSB.h(s.config.bankNumber||'Rekening belum tersedia')}<br>a.n. ${KSB.h(s.config.bankHolder||'-')}</p>${s.config.qrisImage?`<p><strong>Atau bayar dengan QRIS merchant KSB GO:</strong></p><img alt="QRIS merchant resmi KSB GO" loading="lazy" style="max-width:260px;width:100%;height:auto" src="${KSB.h(s.config.qrisImage)}"><p class="small muted">Pastikan penerima QRIS resmi KSB GO dan isi nominal tepat sesuai total order.</p>`:''}<p class="small muted">Upload bukti tidak otomatis mengonfirmasi dana. Admin harus memeriksa mutasi bank atau laporan QRIS resmi.</p>${d.payments.filter(p=>['PENDING','PROOF_SUBMITTED'].includes(p.status)).map(p=>`<form data-form="proof"><input type="hidden" name="paymentId" value="${KSB.h(p.id)}"><div class="field"><label>Bukti transfer (JPG / PNG / PDF)</label><input name="file" type="file" accept="image/jpeg,image/png,application/pdf" required></div><button class="btn full">Upload Bukti</button></form>`).join('')}</div>`:''}</div></div>`);}
 if(view==='payments'){if(!KSB.needLogin())return KSB.accountView();let ps=await KSB.call('payment.list');return KSB.page('Riwayat Pembayaran',ps.length?ps.map(p=>`<div class="card" style="margin-bottom:10px"><div class="flex between"><b>${KSB.h(p.order_id)}</b>${KSB.status(p.status)}</div>${KSB.cardRow(p.method,p.reference,KSB.rup(p.amount))}${KSB.btn('Buka Order','orderDetail',p.order_id)}</div>`).join(''):KSB.empty('Belum ada pembayaran'));}
 if(view==='parcel'){if(!KSB.needLogin())return KSB.accountView();let ads=await KSB.call('address.list');let opts=ads.map(a=>({id:a.id,name:a.label+' · '+a.address}));return KSB.page('🚚 KSB RUTE — Kirim Paket',ads.length>=2?`<div class="aside-split"><form class="card" data-form="parcel"><span class="pill blue">Kirim Paket</span><h3>Detail Pengiriman</h3>${KSB.select('senderAddressId','Dari (Pengirim)',opts)}${KSB.select('recipientAddressId','Ke (Penerima)',opts)}${KSB.select('service','Jenis Layanan',[{id:'REGULAR',name:'Reguler'},{id:'EXPRESS',name:'Express'},{id:'INTERDISTRICT',name:'Antar Kecamatan'},{id:'UMKM',name:'Pengiriman UMKM'}])}${KSB.field('weight','Berat (kg)','number','1',true,'step="0.1" min="0.1"')}${KSB.select('paymentMethod','Pembayaran',[{id:'TRANSFER',name:'Transfer'},{id:'COD',name:'COD'}])}<label class="flex" style="min-height:44px"><input class="check" type="checkbox" name="acceptZoneTariff"> Setujui tarif zona bila API rute gagal.</label><div class="btn-group"><button type="button" class="btn blue" data-action="quoteParcel">Hitung Ongkir</button><button type="submit" class="btn">Buat Pengiriman</button></div></form><div class="card"><h3>Rute Pengiriman</h3><div id="parcel-map" class="map-box"><div>📍 Pilih alamat dengan koordinat untuk melihat peta.</div></div><div id="quote-result" class="notice">Tarif dihitung langsung dari backend dan aturan wilayah admin.</div></div></div>`:KSB.empty('Butuh dua alamat','Tambahkan alamat pengirim dan penerima lebih dahulu.',KSB.btn('Kelola Alamat','goAddress')));}
 if(view==='track'){if(!KSB.needLogin())return KSB.accountView();const d=await KSB.call('delivery.track',{deliveryId:args.id});return KSB.page('Lacak Pesanan',`<div class="aside-split"><div class="grid"><div class="card"><h3>${KSB.h(d.delivery.id)}</h3>${KSB.status(d.delivery.status)}<div id="tracking-map" class="map-box" style="margin-top:15px"><div>Lokasi pickup dan tujuan</div></div><p class="small muted">Mode: pembaruan status. GPS realtime belum aktif tanpa integrasi layanan realtime.</p></div><div class="card"><h3>Perjalanan Paket</h3><div class="timeline">${d.history.length?d.history.map(x=>`<div><b>${KSB.h(x.status)}</b><div class="small muted">${KSB.h(x.created_at)}</div></div>`).join(''):'<div>Menunggu riwayat status</div>'}</div></div></div><div class="card"><h3>Informasi Kurir</h3>${d.courier?`<p>${KSB.h(d.courier.name)}</p><a class="btn outline" href="https://wa.me/${KSB.h(String(d.courier.phone).replace(/[^\d]/g,'').replace(/^0/,'62'))}" target="_blank" rel="noopener">WhatsApp Kurir</a>`:'<p class="muted">Belum ada kurir yang mengklaim order.</p>'}<div class="kv"><span>Dari</span><span>${KSB.h(d.delivery.pickup_address)}</span></div><div class="kv"><span>Ke</span><span>${KSB.h(d.delivery.dropoff_address)}</span></div></div></div>`);}
 if(view==='account')return KSB.accountView();return KSB.empty('Halaman tidak ditemukan');
};
KSB.actions.product=async el=>KSB.goto('product',{id:el.dataset.id});
KSB.actions.category=async el=>KSB.goto('categories',{category:el.dataset.id});
KSB.actions.clearFilters=async()=>KSB.goto('home');
KSB.actions.goHome=async()=>KSB.goto('home');
KSB.actions.goCart=async()=>KSB.goto('cart');
KSB.actions.goAddress=async()=>KSB.goto('address');
KSB.actions.goPayments=async()=>KSB.goto('payments');
KSB.actions.goParcel=async()=>KSB.goto('parcel');
KSB.actions.loadMore=async()=>{KSB.state.page++;await KSB.refresh();};
KSB.actions.addCart=async el=>{if(!KSB.needLogin())return;await KSB.run(async()=>{await KSB.call('cart.add',{product_id:el.dataset.id,quantity:Number(document.getElementById('product-qty')?.value||1)});KSB.toast('Produk ditambahkan ke keranjang.');});};
KSB.actions.buyNow=async el=>{if(!KSB.needLogin())return;await KSB.run(async()=>{const cart=await KSB.call('cart.add',{product_id:el.dataset.id,quantity:Number(document.getElementById('product-qty')?.value||1)});const item=(cart.items||[]).find(x=>x.product_id===el.dataset.id);if(item){KSB.state.selectedItems=new Set([item.id]);KSB.state.cartSelectionInitialized=true;}await KSB.goto(item?'checkout':'cart');});};
KSB.actions.cartQty=async el=>KSB.run(async()=>{const item=KSB.state.cart.items.find(x=>x.id===el.dataset.id),qty=item.quantity+Number(el.dataset.delta);if(qty<=0)return KSB.toast('Gunakan tombol Hapus untuk menghapus produk.');await KSB.call('cart.update',{id:item.id,quantity:qty});await KSB.refresh();});
KSB.actions.removeCart=async el=>KSB.run(async()=>{await KSB.call('cart.remove',{id:el.dataset.id});KSB.state.selectedItems.delete(el.dataset.id);await KSB.refresh();});
KSB.actions.selectAll=async()=>{KSB.state.cart.items.forEach(x=>KSB.state.selectedItems.add(x.id));await KSB.refresh();};
KSB.actions.checkoutPage=async()=>{if(!KSB.state.selectedItems.size)return KSB.toast('Pilih produk terlebih dahulu.',true);await KSB.goto('checkout');};
KSB.actions.orderDetail=async el=>KSB.goto('order',{id:el.dataset.id});
KSB.actions.cancelOrder=async el=>{if(!confirm('Batalkan pesanan yang belum diproses?'))return;await KSB.run(async()=>{await KSB.call('order.cancel',{id:el.dataset.id});await KSB.refresh();});};
KSB.actions.track=async el=>KSB.goto('track',{id:el.dataset.id});
KSB.actions.editAddress=async el=>{let rows=await KSB.call('address.list'),a=rows.find(x=>x.id===el.dataset.id),form=document.querySelector('[data-form="address"]');if(!a||!form)return;Object.entries(a).forEach(([key,val])=>{if(form.elements[key])form.elements[key].value=val;});document.getElementById('address-form-title').textContent='Ubah Alamat';form.scrollIntoView({behavior:'smooth'});};
KSB.forms.search=async form=>KSB.goto('categories',{q:form.elements.q.value});
KSB.forms.profile=async form=>{await KSB.run(async()=>{KSB.state.user=await KSB.call('auth.profile',{name:form.elements.name.value,phone:form.elements.phone.value});await KSB.refresh();KSB.toast('Profil tersimpan.');});};
KSB.forms.address=async form=>KSB.run(async()=>{const f=Object.fromEntries(new FormData(form));await KSB.call('address.save',f);await KSB.refresh();KSB.toast('Alamat tersimpan.');});
KSB.forms.checkout=async form=>KSB.run(async()=>{const f=Object.fromEntries(new FormData(form));let key=KSB.state.checkoutKey||(KSB.state.checkoutKey=KSB.requestKey());const r=await KSB.call('order.checkout',{addressId:f.addressId,service:f.service,paymentMethod:f.paymentMethod,voucherCode:f.voucherCode,acceptZoneTariff:!!f.acceptZoneTariff,whatsappConsent:!!f.whatsappConsent,itemIds:KSB.state.checkoutItems.map(i=>i.id),requestKey:key});KSB.state.checkoutKey=null;KSB.state.selectedItems.clear();KSB.state.cartSelectionInitialized=false;await KSB.goto('order',{id:r.id});KSB.toast('Order berhasil dibuat.');if(f.paymentMethod==='GATEWAY'){try{const g=await KSB.call('payment.gateway.start',{orderId:r.id});if(g.checkoutUrl)window.open(g.checkoutUrl,'_blank','noopener,noreferrer');else KSB.toast('Sesi: '+g.status);}catch(ex){KSB.toast('Order tersimpan, sesi pembayaran belum siap. Cek lagi melalui detail pesanan.',true);}}});
KSB.forms.proof=async form=>KSB.run(async()=>{const pay=form.elements.paymentId.value,a=await KSB.upload(form.elements.file.files[0],'PAYMENT',pay);await KSB.call('payment.proof',{paymentId:pay,attachmentId:a.id});KSB.toast('Bukti terkirim, menunggu verifikasi admin.');await KSB.refresh();});
KSB.forms.parcel=async form=>KSB.run(async()=>{const f=Object.fromEntries(new FormData(form)),key=KSB.state.parcelKey||(KSB.state.parcelKey=KSB.requestKey());const r=await KSB.call('delivery.create',{...f,acceptZoneTariff:!!f.acceptZoneTariff,requestKey:key});KSB.state.parcelKey=null;KSB.toast('Pengiriman dibuat.');await KSB.goto('order',{id:r.id});});
KSB.actions.quoteParcel=async()=>KSB.run(async()=>{const form=document.querySelector('[data-form="parcel"]'),f=Object.fromEntries(new FormData(form)),ads=await KSB.call('address.list'),a=ads.find(x=>x.id===f.senderAddressId),b=ads.find(x=>x.id===f.recipientAddressId);if(!a||!b)throw Error('Pilih alamat pengirim/penerima');const q=await KSB.call('delivery.quote',{fromDistrict:a.district_id,toDistrict:b.district_id,fromLat:a.lat,fromLng:a.lng,toLat:b.lat,toLng:b.lng,weight:f.weight,service:f.service});document.getElementById('quote-result').textContent=q.available?`Ongkir: ${KSB.rup(q.fee)} · ${q.source} · ${q.distance_m===null?'Jarak belum tersedia':(q.distance_m/1000).toFixed(1)+' km'}. ${q.message}`:q.message;KSB.showMap('parcel-map',a,b);});
</script>

<script> KSB.actions.useGPS=async ()=>{if(!navigator.geolocation){KSB.toast('GPS browser tidak tersedia',true);return;}KSB.toast('Meminta izin lokasi GPS…');navigator.geolocation.getCurrentPosition(p=>{const f=document.querySelector('[data-form="address"]');if(!f)return;f.elements.lat.value=p.coords.latitude.toFixed(7);f.elements.lng.value=p.coords.longitude.toFixed(7);KSB.toast('Koordinat GPS diperoleh.');},e=>KSB.toast('Izin GPS ditolak/tidak tersedia: '+e.message,true),{enableHighAccuracy:true,timeout:12000,maximumAge:0});}; </script>

<script>
KSB.partnerBankView=async function(role){const a=await KSB.call('partner.payout.get',{role});return KSB.page('Rekening Pencairan '+(role==='SELLER'?'Seller':'Kurir'),`<div class="card"><h3>🏦 Rekening milik mitra</h3><p class="small muted">Pembeli tidak mentransfer langsung ke rekening ini. Rekening dipakai untuk pencairan yang sudah diverifikasi admin. Penyimpanan di database tidak melakukan transfer otomatis.</p><div class="notice">Status: ${KSB.h(a.status)}</div><form data-form="partnerPayout"><input type="hidden" name="role" value="${role}">${KSB.field('bank_name','Bank','text',a.bank_name||'',true)}${KSB.field('account_number','Nomor Rekening','text',a.account_number||'',true)}${KSB.field('account_holder','Nama Pemilik Rekening','text',a.account_holder||'',true)}<button class="btn full">Simpan untuk diverifikasi admin</button></form><div class="notice warn">Mengubah rekening setelah disetujui akan mengulang verifikasi. Jangan mencantumkan PIN, OTP, atau kata sandi bank.</div></div>`);};
KSB.forms.partnerPayout=async form=>KSB.run(async()=>{const f=Object.fromEntries(new FormData(form));await KSB.call('partner.payout.save',f);KSB.toast('Rekening dicatat, menunggu verifikasi admin.');await KSB.refresh();});
</script>

<script>KSB.actions.gatewayStart=async el=>KSB.run(async()=>{const id=el.dataset.id;const d=await KSB.call('payment.gateway.start',{orderId:id});if(d.checkoutUrl){KSB.toast('Gunakan tautan checkout test di rincian pesanan.');}else KSB.toast('Status: '+d.status);await KSB.goto('order',{id:id});});KSB.actions.gatewayCheck=async el=>KSB.run(async()=>{const id=el.dataset.id;const d=await KSB.call('payment.gateway.check',{orderId:id});KSB.toast('Status gateway: '+d.status);await KSB.goto('order',{id:id});});</script>

<script>
KSB.actions.requestRefundV15=async el=>{
  KSB.modal('Ajukan Pengembalian Dana',`<form data-form="refundRequestV15"><input type="hidden" name="orderId" value="${KSB.h(el.dataset.id)}">${KSB.field('reason','Alasan refund (min. 10 karakter)','text','',true)}<button class="btn full">Kirim Pengajuan</button></form>`);
};
KSB.forms.refundRequestV15=async form=>KSB.run(async()=>{
  const f=Object.fromEntries(new FormData(form));await KSB.call('refund.request',f);KSB.closeModal();KSB.toast('Permintaan refund masuk. Pengiriman dihentikan untuk pemeriksaan Admin.');await KSB.goto('orders');
});
</script>

<script>
KSB.actions.confirmBuyerReceiptV16=async el=>{
 if(!window.confirm('Konfirmasi barang untuk pengiriman '+el.dataset.id+' SUDAH Anda terima dalam kondisi sesuai? Setelah dikonfirmasi, Seller dan Kurir bisa mengajukan penagihan penghasilan.'))return;
 await KSB.run(async()=>{
  await KSB.call('order.received',{deliveryId:el.dataset.id});
  KSB.toast('Barang diterima. Terima kasih telah mengonfirmasi.');
  await KSB.refresh();
 });
};
</script>
