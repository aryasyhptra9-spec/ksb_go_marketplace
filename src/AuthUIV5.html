<style>
.auth-v5{max-width:960px;margin:24px auto 100px}.auth-v5 h1{font-size:clamp(24px,4vw,36px);margin:10px 0 8px}.auth-v5-intro{color:#63766d;margin-bottom:20px}.auth-v5-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.auth-v5-role{background:white;border:1px solid #dde8e0;border-radius:18px;padding:20px 14px;text-align:left;min-height:155px;cursor:pointer;transition:border-color .18s,transform .18s}.auth-v5-role:hover,.auth-v5-role.active{border-color:#00945a;transform:translateY(-2px);box-shadow:0 6px 24px #09381c14}.auth-v5-role strong{display:block;color:#183d2c;font-size:17px;margin:12px 0 6px}.auth-v5-role small{line-height:1.55;color:#5d7367;display:block}.auth-v5-icon{font-size:29px}.auth-v5-form{max-width:520px;margin:22px auto;padding:26px;border:1px solid #dce9df;border-radius:20px;background:#fff;box-shadow:0 14px 40px #155c2510}.auth-v5-form h2{font-size:23px;margin:0 0 8px}.auth-v5-form p{color:#63766d;font-size:14px}.auth-v5-form .btn{width:100%;min-height:46px;margin-top:12px}.auth-v5-form input{width:100%;font-size:16px}.auth-v5-status{border-radius:12px;padding:12px 14px;background:#f4f8f5;margin:10px 0;line-height:1.5}.auth-v5-actions{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.auth-v5-panel{padding:18px;background:#fff;border:1px solid #dce9df;border-radius:18px}.auth-v5-chips{display:flex;flex-wrap:wrap;gap:8px}.auth-v5-chips span{padding:6px 10px;background:#e9f5ed;border-radius:999px;font-size:12px}.auth-v5-secondary{border:0;background:transparent;color:#007e49;text-decoration:underline;padding:10px 0;cursor:pointer}
@media(max-width:800px){.auth-v5-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:380px){.auth-v5-grid{grid-template-columns:1fr 1fr;gap:8px}.auth-v5-role{padding:12px;min-height:160px}.auth-v5-role strong{font-size:15px}}@media(max-width:320px){.auth-v5-grid{grid-template-columns:1fr}}
</style>
<script>
(function(){
 const R={BUYER:{name:'Pembeli',icon:'🛍️',desc:'Belanja, checkout, favorit, dan lacak pesanan.'},SELLER:{name:'Seller',icon:'🏪',desc:'Kelola toko, produk, stok, dan penjualan.'},COURIER:{name:'Kurir',icon:'🛵',desc:'Ambil order, antar paket, dan kelola pendapatan.'}};
 KSB.state.loginRole='BUYER';KSB.state.otpChallenge='';KSB.state.otpEmail='';
 KSB.authRoleCards=function(){return `<div class="auth-v5-grid">${Object.entries(R).map(([id,r])=>`<button class="auth-v5-role ${KSB.state.loginRole===id?'active':''}" data-action="authSelectRole" data-role="${id}" type="button"><span class="auth-v5-icon">${r.icon}</span><strong>${r.name}</strong><small>${r.desc}</small></button>`).join('')}</div>`;};
 KSB.authGuestView=function(){const r=R[KSB.state.loginRole]||R.BUYER;return `<section class="auth-v5"><span class="pill">🔐 Akses KSB GO</span><h1>Masuk ke KSB GO</h1><p class="auth-v5-intro">Pilih jenis akun. Semua peran menggunakan verifikasi email; izin setiap role ditentukan oleh sistem.</p>${KSB.authRoleCards()}<div class="auth-v5-form">${KSB.state.otpChallenge?`<h2>Verifikasi email</h2><p>Kode 8 angka telah dikirim ke <b>${KSB.h(KSB.state.otpEmail)}</b>.</p><form data-form="authOtpVerify"><div class="field"><label for="otp_code">Kode verifikasi</label><input id="otp_code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" minlength="8" maxlength="8" required placeholder="12345678"></div><button type="submit" class="btn">Verifikasi & Masuk</button></form><button type="button" class="auth-v5-secondary" data-action="authResetOtp">Gunakan email lain</button>`:`<h2>Masuk sebagai ${r.name}</h2><p>Kode login akan dikirim melalui email setelah verifikasi keamanan. Tanpa password dan tanpa biaya SMS.</p><form data-form="authOtpStart"><div class="field"><label for="auth_email">Alamat email</label><input id="auth_email" name="email" autocomplete="email" inputmode="email" type="email" placeholder="nama@gmail.com" required value="${KSB.h(KSB.state.otpEmail)}"></div><button type="submit" class="btn">Kirim kode ke email</button></form>`}<p class="small muted">Kode berlaku 20 menit. Jangan bagikan kode atau identitas login kepada siapa pun.</p></div></section>`;};
 KSB.authUserView=function(){const u=KSB.state.user;const r=R[KSB.state.loginRole]||R.BUYER;const status=KSB.state.roleStatuses||[];const current=status.find(s=>s.role===KSB.state.loginRole);return `<section class="auth-v5"><span class="pill">✅ Login berhasil</span><h1>Halo, ${KSB.h(u.name)}</h1><p class="auth-v5-intro">${KSB.h(u.email)} · Pilih dashboard sesuai akses yang telah disetujui.</p>${KSB.authRoleCards()}<div class="auth-v5-panel"><h3>Akses aktif</h3><div class="auth-v5-chips">${u.roles.map(role=>`<span>✓ ${KSB.h(R[role]?.name||role)}</span>`).join('')}</div><div class="auth-v5-status">${u.roles.includes(KSB.state.loginRole)?`Anda mempunyai akses <b>${r.name}</b>. Tekan tombol di bawah untuk membuka dashboard.`:current?.status==='PENDING'?`Pengajuan ${r.name} sedang menunggu persetujuan admin.`:current?.status==='REJECTED'?`Pengajuan ${r.name} ditolak. Hubungi admin sebelum mengajukan kembali.`:KSB.state.loginRole==='ADMIN'?`Akun ini bukan admin. Hanya email yang telah ditetapkan pemilik melalui ADMIN_EMAIL yang dapat memperoleh peran admin.`:`Belum memiliki akses ${r.name}. Daftarkan peran terlebih dahulu.`}</div>${u.roles.includes(KSB.state.loginRole)?`<button class="btn" data-action="authOpenDashboard" type="button">Buka Dashboard ${r.name} →</button>`:KSB.state.loginRole==='SELLER'||KSB.state.loginRole==='COURIER'?current?.status?'' : `<form data-form="authPartnerApply">${KSB.field('name','Nama lengkap','text',u.name,true)}${KSB.field('phone','Nomor WhatsApp (wajib untuk kurir)','tel',u.phone||'',KSB.state.loginRole==='COURIER')}${KSB.state.loginRole==='COURIER'?KSB.field('vehicle','Kendaraan','text','Motor',true):''}<button class="btn" type="submit">Ajukan sebagai ${r.name}</button></form>`:''}<div class="auth-v5-actions"><button type="button" class="btn outline" data-action="authMyProfile">Profil & pengaturan</button><button type="button" class="btn secondary" data-action="logout">Keluar</button></div></div></section>`;};
 KSB.authPage=function(){return KSB.state.user?KSB.authUserView():KSB.authGuestView();};
 const prevBuyer=KSB.buyer;
 KSB.buyer=async function(view,args){if(view==='account'||view==='login')return KSB.authPage();if(view==='profile'&&KSB.state.user){const u=KSB.state.user;return KSB.page('Profil Saya',`<div class=\"card\"><form data-form=\"profile\">${KSB.field('name','Nama lengkap','text',u.name,true)}${KSB.field('phone','Nomor WhatsApp','tel',u.phone||'')}<button class=\"btn\" type=\"submit\">Simpan profil</button></form></div>`);}return prevBuyer(view,args);};
 const prevSeller=typeof KSB.seller==='function'?KSB.seller:null,prevCourier=typeof KSB.courier==='function'?KSB.courier:null,prevAdmin=typeof KSB.admin==='function'?KSB.admin:null;
 KSB.seller=async function(view,args){if(view==='account')return KSB.authPage();return typeof prevSeller==='function'?prevSeller(view,args):KSB.empty('Modul Seller belum tersedia','Periksa file Seller.html pada deployment.');};
 KSB.courier=async function(view,args){if(view==='account')return KSB.authPage();return typeof prevCourier==='function'?prevCourier(view,args):KSB.empty('Modul Kurir belum tersedia','Periksa file Courier.html pada deployment.');};
 KSB.admin=async function(view,args){if(view==='account')return KSB.authPage();return typeof prevAdmin==='function'?prevAdmin(view,args):KSB.empty('Modul Admin belum tersedia','Periksa file AdminView.html pada deployment.');};
 KSB.accountView=function(){return KSB.authPage();};
 KSB.needLogin=function(){if(this.state.user)return true;this.state.loginRole=this.state.loginRole||'BUYER';this.goto('account');return false;};
 KSB.actions.authSelectRole=async el=>{const role=el.dataset.role;if(!R[role])return;KSB.state.loginRole=role;KSB.state.otpChallenge='';if(KSB.state.user&&KSB.state.user.roles.includes(role)){await KSB.switchRole(role);return;}KSB.state.role='BUYER';await KSB.goto('account');};
 KSB.actions.authResetOtp=async()=>{KSB.state.otpChallenge='';await KSB.goto('account');};
 KSB.forms.authOtpStart=async form=>KSB.run(async()=>{const email=form.elements.email.value.trim();const ans=await KSB.call('auth.otp.start',{email,role:KSB.state.loginRole});KSB.state.otpEmail=email;KSB.state.otpChallenge=ans.challengeId;await KSB.goto('account');KSB.toast('Kode verifikasi dikirim. Periksa juga folder Spam.');});
 KSB.forms.authOtpVerify=async form=>KSB.run(async()=>{const answer=await KSB.call('auth.otp.verify',{challengeId:KSB.state.otpChallenge,code:form.elements.code.value});KSB.state.token=answer.token;KSBStore.setItem('ksb_token',answer.token);KSB.state.user=answer.user;KSB.state.otpChallenge='';await KSB.authLoadStatuses();const r=KSB.state.loginRole;if(answer.user.roles.includes(r)){KSB.state.role=r;await KSB.goto(r==='BUYER'?'home':'dashboard');}else{KSB.state.role='BUYER';await KSB.goto('account');}KSB.toast('Berhasil masuk sebagai '+answer.user.name);});
 KSB.authLoadStatuses=async function(){if(!KSB.state.user)return;try{KSB.state.roleStatuses=await KSB.call('auth.roles');}catch(e){KSB.state.roleStatuses=[];}};
 KSB.actions.authOpenDashboard=async()=>KSB.switchRole(KSB.state.loginRole);
 KSB.actions.authMyProfile=async()=>{KSB.state.role='BUYER';await KSB.goto('profile');};
 KSB.forms.authPartnerApply=async form=>KSB.run(async()=>{const role=KSB.state.loginRole;if(!['SELLER','COURIER'].includes(role))throw Error('Role tidak dapat diajukan.');const name=form.elements.name.value,phone=form.elements.phone.value;KSB.state.user=await KSB.call('auth.profile',{name,phone});await KSB.call('auth.apply',{role,vehicle:form.elements.vehicle?.value||'',phone});await KSB.authLoadStatuses();await KSB.goto('account');KSB.toast('Pengajuan '+role+' menunggu persetujuan admin.');});
 const oldInit=KSB.init;
 KSB.init=async function(){await oldInit.call(this);if(this.state.user)await this.authLoadStatuses();};
 // Explicit no-op: OTP works without external Google Client ID.
 KSB.renderGoogleButton=function(){};
})();
</script>
