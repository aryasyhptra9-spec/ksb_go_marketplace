<script>
KSB.seller=async function(view,args){if(!KSB.state.user?.roles.includes('SELLER'))return KSB.accountView();
 if(view==='dashboard'){let d=await KSB.call('seller.dashboard');if(!d.store)return KSB.page('Dashboard Seller',`<div class="notice">Seller disetujui. Buat toko sebelum menambahkan produk.</div>${KSB.btn('Buat Toko Sekarang','sellerStore','','outline')}`);return KSB.page('🏪 '+d.store.name,`<div class="grid grid-2 stats-grid"><div class="stat"><div class="title">Total Produk</div><div class="value">${d.totalProducts}</div></div><div class="stat"><div class="title">Semua Pesanan</div><div class="value">${d.totalOrders}</div></div><div class="stat"><div class="title">Siap Diambil</div><div class="value">${d.ready}</div></div><div class="stat"><div class="title">Saldo Hak Seller</div><div class="value">${KSB.rup(d.payable)}</div></div></div><h3 class="section-title">Menu Seller</h3><div class="grid grid-2">${KSB.btn('Kelola Produk','sellerProducts','','outline')}${KSB.btn('Pesanan Masuk','sellerOrders','','outline')}${KSB.btn('Pengaturan Toko','sellerStore','','outline')}${KSB.btn('Keuangan','sellerFinance','','outline')}</div><h3 class="section-title">Pesanan Terakhir</h3><div class="card">${d.recent.length?d.recent.map(x=>KSB.cardRow(x.id,x.status,KSB.btn('Detail','sellerOrders','','outline'))).join(''):KSB.empty('Belum ada pesanan')}</div>`);}
 if(view==='store'){let r=await KSB.call('seller.store'),d=r.store||{};return KSB.page('Pengaturan Toko',`<div class="card"><form data-form="store">${KSB.field('name','Nama Toko','text',d.name||'',true)}${KSB.field('description','Deskripsi Toko','text',d.description||'')}${KSB.field('whatsapp','WhatsApp Toko (08... atau 62...)','tel',d.whatsapp||'')}${KSB.select('district_id','Kecamatan',KSB.districtOptions(),d.district_id)}${KSB.field('address','Alamat Toko','text',d.address||'',true)}<div class="grid grid-2">${KSB.field('lat','Latitude','number',d.lat||'',false,'step="any"')}${KSB.field('lng','Longitude','number',d.lng||'',false,'step="any"')}${KSB.field('opening_time','Jam Buka','time',d.opening_time||'08:00')}${KSB.field('closing_time','Jam Tutup','time',d.closing_time||'21:00')}</div>${KSB.select('status','Status Toko',[{id:'ACTIVE',name:'Aktif'},{id:'INACTIVE',name:'Nonaktif sementara'}],d.status||'ACTIVE')}<button class="btn full">Simpan Toko</button></form></div>`);}
 if(view==='products'){let d;try{d=await KSB.call('seller.product.list',{page:KSB.state.page});}catch(e){return KSB.page('Produk Saya',KSB.empty('Belum punya toko','Buat profil toko dahulu.',KSB.btn('Buat Toko','sellerStore','','outline')));}return KSB.page('Produk Saya',`<div class="flex between" style="margin-bottom:16px"><span class="muted">${d.total} produk</span>${KSB.btn('＋ Tambah Produk','sellerNewProduct','','')}</div><div class="card">${d.items.length?d.items.map(p=>KSB.cardRow(p.name,`${KSB.rup(p.price)} · Stok ${p.stock} · ${p.active==='TRUE'?'Aktif':'Nonaktif'}`,KSB.btn('Edit','sellerEditProduct',p.id,'outline'))).join(''):KSB.empty('Belum ada produk','Tambahkan produk pertama Anda.')}</div>`);}
 if(view==='product'){let p=null,cats=KSB.state.categories;if(args.id){let r=await KSB.call('seller.product.list',{size:40});p=r.items.find(x=>x.id===args.id);}if(!cats.length)cats=(await KSB.call('catalog',{size:1})).categories;let photos=p?await KSB.call('seller.product.photos',{productId:p.id}):[];return KSB.page(p?'Edit Produk':'Tambah Produk',`<div class="card"><form data-form="product"><input type="hidden" name="id" value="${KSB.h(p?.id||'')}">${KSB.field('name','Nama Produk','text',p?.name||'',true)}${KSB.field('description','Deskripsi','text',p?.description||'')}${KSB.select('category_id','Kategori',cats.map(x=>({id:x.id,name:x.name})),p?.category_id)}<div class="grid grid-2">${KSB.field('price','Harga (Rupiah)','number',p?.price||'',true,'min="1" step="1"')}${KSB.field('stock','Stok','number',p?.stock??0,true,'min="0" step="1"')}</div>${KSB.select('active','Status Produk',[{id:'true',name:'Aktif'},{id:'false',name:'Nonaktif'}],p?.active==='FALSE'?'false':'true')}<div class="field"><label>Foto produk JPG/PNG (maks 4 MB)</label><input name="photo" type="file" accept="image/jpeg,image/png" multiple><p class="small muted">Maksimum 5 foto JPG/PNG per produk, 4 MB per foto.</p></div><div class="grid grid-2">${photos.map(x=>`<div class="card"><img src="${KSB.h(x.url)}" style="width:100%;height:95px;object-fit:cover" alt="Foto produk"><button type="button" class="btn danger small" data-action="sellerRemovePhoto" data-id="${KSB.h(x.id)}">Hapus foto</button></div>`).join('')}</div><button class="btn full">Simpan Produk</button></form></div>`);}
 if(view==='orders'){
  const d=await KSB.call('seller.orders',{page:KSB.state.page});
  const rows=d.items.length?d.items.map(o=>{
    const method=String(o.payment_method||'');
    const paid=o.payment_verified===true||o.payment_verified==='TRUE'||o.payment_status==='PAID'||method==='COD';
    const pending=!paid;
    const badge=pending?'<span class="pill warning">MENUNGGU PEMBAYARAN</span>':KSB.status(o.status);
    const paymentInfo=pending
      ?'<div class="notice warn" role="status" style="margin-top:12px">Transfer pembeli belum diverifikasi Admin. Tombol Terima/Tolak baru tersedia setelah pembayaran sah. Periksa lagi melalui Refresh.</div>'
      :'<div class="small muted" style="margin-top:8px">Pembayaran: terverifikasi / memenuhi syarat proses</div>';
    const actions=[];
    if(paid&&o.status==='NEW'){
      actions.push(KSB.btn('Terima','sellerStatus',o.id+':ACCEPTED'));
      actions.push(KSB.btn('Tolak','sellerStatus',o.id+':REJECTED','danger'));
    }
    if(paid&&o.status==='ACCEPTED')actions.push(KSB.btn('Mulai Siapkan','sellerStatus',o.id+':PREPARING'));
    if(paid&&o.status==='PREPARING')actions.push(KSB.btn('Siap Diambil Kurir','sellerStatus',o.id+':READY'));
    actions.push(KSB.btn('Lihat Order','orderDetail',o.order_id,'outline'));
    return `<div class="card" style="margin-bottom:12px"><div class="flex between"><b>${KSB.h(o.id)}</b>${badge}</div><div class="kv"><span>Subtotal</span><span>${KSB.rup(o.subtotal)}</span></div><div class="small muted">Order: ${KSB.h(o.order_id)}</div>${paymentInfo}<div class="btn-group" style="margin-top:12px">${actions.join('')}</div></div>`;
  }).join(''):KSB.empty('Belum ada pesanan.');
  const controls='<p class="small muted">Data pesanan dapat diperbarui dengan tombol Refresh di kanan atas. Pada halaman ini, data juga diperbarui otomatis saat tab aktif.</p>';
  return KSB.page('Pesanan Seller',controls+rows);
 }
 if(view==='finance'){let f=await KSB.call('finance.mine',{role:'SELLER'});return KSB.page('Keuangan Seller',`<div class="grid grid-2"><div class="stat"><div class="title">Hak Seller Belum Ditransfer</div><div class="value">${KSB.rup(f.payable)}</div></div><div class="stat"><div class="title">Komisi Sudah Dipotong</div><div class="value">${KSB.rup(f.deductedFees)}</div></div></div><div class="notice">Komisi yang sudah dipotong saat settlement tidak menjadi tagihan kedua.</div>${KSB.btn('🏦 Atur rekening pencairan seller','sellerPayout','','outline')}${KSB.btn('📋 Ajukan pencairan per order','sellerClaims','','outline')}<h3 class="section-title">Invoice / Statement</h3><div class="card">${f.invoices.length?f.invoices.map(i=>KSB.cardRow(i.id,i.period_start+' s.d. '+i.period_end,KSB.btn('Unduh PDF','downloadInvoice',i.id))).join(''):KSB.empty('Belum ada statement')}</div><h3 class="section-title">Riwayat Settlement</h3><div class="card">${f.settlements.length?f.settlements.map(x=>KSB.cardRow(KSB.rup(x.amount),x.bank_reference,KSB.status(x.status))).join(''):KSB.empty('Belum ada transfer settlement')}</div>`);}
 if(view==='claims')return KSB.manualClaimsView('SELLER');
 if(view==='payout')return KSB.partnerBankView('SELLER');
 if(view==='order')return KSB.buyer('order',args);if(view==='account')return KSB.accountView();return KSB.empty('Menu seller tidak ditemukan');
};
KSB.actions.sellerRemovePhoto=async el=>KSB.run(async()=>{if(!confirm('Hapus foto ini?'))return;const r=await KSB.call('seller.product.photo.remove',{imageId:el.dataset.id});await KSB.goto('product',{id:r.productId});});
KSB.actions.sellerClaims=async()=>KSB.goto('claims');
KSB.actions.sellerPayout=async()=>KSB.goto('payout');
KSB.actions.sellerStore=async()=>KSB.goto('store');KSB.actions.sellerProducts=async()=>KSB.goto('products');KSB.actions.sellerOrders=async()=>KSB.goto('orders');KSB.actions.sellerFinance=async()=>KSB.goto('finance');KSB.actions.sellerNewProduct=async()=>KSB.goto('product');KSB.actions.sellerEditProduct=async el=>KSB.goto('product',{id:el.dataset.id});
KSB.actions.sellerStatus=async el=>{const [id,status]=el.dataset.id.split(':');if(status==='REJECTED'&&!confirm('Tolak order? Order berbayar akan masuk penanganan sengketa/refund admin.'))return;await KSB.run(async()=>{await KSB.call('seller.order.status',{id,status});KSB.toast('Status seller diperbarui.');await KSB.refresh();});};
KSB.forms.store=async form=>KSB.run(async()=>{await KSB.call('seller.store.save',Object.fromEntries(new FormData(form)));KSB.toast('Data toko tersimpan.');await KSB.goto('dashboard');});
KSB.forms.product=async form=>KSB.run(async()=>{const data=Object.fromEntries(new FormData(form));data.active=data.active==='true';const photos=Array.from(form.elements.photo.files);delete data.photo;if(photos.length>5)throw Error('Maksimal 5 foto per produk');const p=await KSB.call('seller.product.save',data);const existing=await KSB.call('seller.product.photos',{productId:p.id});if(existing.length+photos.length>5)throw Error('Jumlah foto melebihi 5. Hapus foto lama dahulu.');for(const photo of photos)await KSB.upload(photo,'PRODUCT',p.id);KSB.toast('Produk berhasil disimpan.');await KSB.goto('products');});
</script>
