<script>
KSB.admin=async function(view,args){if(!KSB.state.user?.roles.includes('ADMIN'))return KSB.accountView();
 if(view==='dashboard'){let d=await KSB.call('admin.dashboard');return KSB.page('📊 Dashboard Admin',`<div class="grid grid-2 stats-grid"><div class="stat"><div class="title">GMV (Nilai Checkout)</div><div class="value">${KSB.rup(d.gmv)}</div></div><div class="stat"><div class="title">Pendapatan Platform Dicatat</div><div class="value">${KSB.rup(d.platformRevenue)}</div></div><div class="stat"><div class="title">Seluruh Order</div><div class="value">${d.orderCount}</div></div><div class="stat"><div class="title">Selesai</div><div class="value">${d.completed}</div></div><div class="stat"><div class="title">Total User / Seller / Kurir</div><div class="value">${d.users} / ${d.sellers} / ${d.couriers}</div></div><div class="stat"><div class="title">Transfer Terverifikasi</div><div class="value">${KSB.rup(d.confirmedTransfer)}</div></div><div class="stat"><div class="title">Setoran COD Belum Masuk</div><div class="value">${KSB.rup(d.codOutstanding)}</div></div><div class="stat"><div class="title">Invoice Belum Lunas</div><div class="value">${KSB.rup(d.invoiceOutstanding)}</div></div></div><h3 class="section-title">Operasional</h3><div class="grid grid-2">${KSB.btn('Persetujuan Mitra','adminPending','','outline')}${KSB.btn('Verifikasi Rekening Mitra','adminPayouts','','outline')}${KSB.btn('Verifikasi Transfer','adminPayments','','outline')}${KSB.btn('Rekonsiliasi Bank / QRIS','adminReconcile','','outline')}${KSB.btn('Tagihan Seller & Kurir','adminClaims','','outline')}${KSB.btn('Semua Pesanan','adminOrders','','outline')}${KSB.btn('Settlement & Keuangan','adminFinance','','outline')}${KSB.btn('Invoice','adminInvoices','','outline')}${KSB.btn('Pengaturan Ongkir','adminSettings','','outline')}${KSB.btn('Laporan','adminReports','','outline')}${KSB.btn('Sengketa','adminDisputes','','outline')}${KSB.btn('Audit, Refund & Pemulihan','adminOpsV15','','outline')}</div><div class="notice">GMV tidak sama dengan pendapatan bersih. Pembayaran transfer menunggu verifikasi mutasi bank.</div><h3 class="section-title">Order Terbaru</h3><div class="card">${d.recent.map(o=>KSB.cardRow(o.id,KSB.date(o.created_at),KSB.status(o.status))).join('')||KSB.empty('Belum ada order')}</div>`);}
 if(view==='operationsV15')return KSB.adminOpsV15();
 if(view==='claims')return KSB.adminClaimsView();
 if(view==='gateway'){let d=await KSB.call('admin.gateway.status');return KSB.page('Gateway & Payout — Staging',`<div class="notice warn">MODE ${KSB.h(d.mode)}. Tidak boleh dipakai untuk transaksi uang nyata. Simulasi payout otomatis perlu API key test, routing code resmi, webhook relay, dan proses verifikasi rekening.</div><div class="card"><h3>Sesi pembayaran terbaru</h3>${d.sessions.items.map(x=>KSB.cardRow(x.order_id,x.status+' · '+x.provider,KSB.rup(x.amount))).join('')||KSB.empty('Belum ada sesi')}</div><div class="card"><h3>Pengajuan pencairan TEST</h3>${d.payouts.items.map(x=>KSB.cardRow(x.party_type+' · '+x.party_id,x.status+' · '+x.id,KSB.rup(x.amount))).join('')||KSB.empty('Belum ada pencairan')}<h3>Rekonsiliasi dana gateway ke bank (TEST)</h3><form data-form="gatewayBankSettlement">${KSB.field('reference','Referensi bank unik','text','',true)}${KSB.field('gross','Total bruto provider (IDR)','number','0',true,'min="1" step="1"')}${KSB.field('fee','Biaya gateway (IDR)','number','0',true,'min="0" step="1"')}<label class="flex"><input class="check" type="checkbox" name="confirmProviderReport" required> Cocok dengan laporan settlement provider</label><label class="flex"><input class="check" type="checkbox" name="confirmBankFunds" required> Dana bersih sudah masuk mutasi rekening</label><button class="btn full">Catat dana terselesaikan</button></form><h3>Masukkan payout uji manual</h3><form data-form="gatewayQueue">${KSB.field('partyId','ID pengguna seller / kurir','text','',true)}${KSB.select('partyType','Jenis mitra',[{id:'SELLER',name:'Seller'},{id:'COURIER',name:'Kurir'}])}${KSB.field('amount','Nominal IDR (0 = seluruh saldo layak)','number','0',true,'min="0" step="1"')}<button class="btn full" type="submit">Antrekan pencairan test</button></form><div class="small muted">Antre payout tidak mengirim uang. Pengiriman test dilakukan oleh trigger, hanya setelah PAYOUT_TEST_RUN=1. Status PAID baru dicatat setelah provider menyatakan SUCCEEDED.</div></div>`);}
 if(view==='payouts'){let rows=await KSB.call('admin.payout.list',{page:KSB.state.page});return KSB.page('Verifikasi Rekening Mitra',`<div class="notice warn">Pastikan kecocokan rekening menggunakan sumber bank/penyedia KYC yang sah. Fitur ini tidak mengirimkan uang.</div>${rows.items.length?rows.items.map(x=>`<div class="card" style="margin-bottom:12px"><b>${KSB.h(x.party_type)} · ${KSB.h(x.party_id)}</b><div class="small muted">${KSB.h(x.bank_name)} — ${KSB.h(x.account_number)} — a.n. ${KSB.h(x.account_holder)}</div><div class="pill">${KSB.h(x.status)}</div>${x.status==='PENDING'?`<form data-form="payoutReview"><input type="hidden" name="id" value="${KSB.h(x.id)}"><label class="flex"><input type="checkbox" name="confirmBankOwner" required> Identitas rekening telah diperiksa independen</label><div class="btn-group"><button class="btn" type="button" data-action="adminPayoutDecision" data-id="${KSB.h(x.id)}" data-approve="true">Verifikasi</button><button class="btn danger" type="button" data-action="adminPayoutDecision" data-id="${KSB.h(x.id)}" data-approve="false">Tolak</button></div></form>`:''}</div>`).join(''):KSB.empty('Belum ada rekening mitra')}</div>`);}
 if(view==='pending'){ let list=await KSB.call('admin.pending');return KSB.page('Persetujuan Mitra',list.length?list.map(x=>`<div class="card" style="margin-bottom:11px"><div class="flex between"><b>${KSB.h(x.user.display_name)}</b><span class="pill">${KSB.h(x.role)}</span></div><div class="small muted">${KSB.h(x.user.email)}</div><div class="btn-group" style="margin-top:12px">${KSB.btn('Setujui','adminApprove',x.id+':true','')}${KSB.btn('Tolak','adminApprove',x.id+':false','danger')}</div></div>`).join(''):KSB.empty('Tidak ada pengajuan menunggu.'));}
 if(view==='payments'){let d=await KSB.call('admin.payments',{page:KSB.state.page});return KSB.page('Konfirmasi Pembayaran',`<div class="notice">Admin cukup melihat foto bukti transfer. <b>Sebelum menyetujui</b>, pastikan uang benar-benar masuk di rekening bank resmi. Foto saja bisa dipalsukan.</div>${d.items.length?d.items.map(p=>`<div class="card" style="margin-bottom:12px"><div class="flex between"><b>${KSB.h(p.id)}</b>${KSB.status(p.status)}</div><div class="small muted">Order ${KSB.h(p.order_id)} · ${KSB.h(p.method)}</div><div class="price">${KSB.rup(p.amount)}</div>${p.method==='TRANSFER'&&p.status==='PROOF_SUBMITTED'?KSB.btn('Lihat Bukti & Konfirmasi','adminProofs',p.id,'outline'):p.method==='TRANSFER'&&p.status==='PENDING'?'<div class="notice">Menunggu Pembeli mengunggah foto bukti transfer.</div>':''}${p.status==='VERIFIED'?'<div class="small muted">Pembayaran telah dikonfirmasi. Catatan persetujuan manual tetap perlu direkonsiliasi dengan bank.</div>':''}</div>`).join(''):KSB.empty('Belum ada transaksi.')}`);}
 if(view==='orders'){let d=await KSB.call('admin.orders',{page:KSB.state.page});return KSB.page('Semua Pesanan',d.items.length?d.items.map(o=>`<div class="card" style="margin-bottom:10px"><div class="flex between"><b>${KSB.h(o.id)}</b>${KSB.status(o.status)}</div><div class="kv"><span>Nilai</span><span>${KSB.rup(o.grand_total)}</span></div>${KSB.btn('Lihat Detail','orderDetail',o.id,'outline')}</div>`).join(''):KSB.empty('Belum ada order'));}
 if(view==='invoices'){let [inv,users]=await Promise.all([KSB.call('admin.invoices',{page:KSB.state.page}),KSB.call('admin.users')]);let partners=users.filter(u=>u.roles.includes('SELLER')||u.roles.includes('COURIER'));return KSB.page('Invoice & Settlement',`<div class="aside-split"><div class="card"><h3>Terbitkan Invoice</h3><form data-form="invoice">${KSB.select('partyId','Mitra',partners.map(p=>({id:p.id,name:p.name+' — '+p.email}))) }${KSB.select('partyType','Jenis Mitra',[{id:'COURIER',name:'Kurir (Tagihan COD)'},{id:'SELLER',name:'Seller (Statement)'}])}${KSB.select('cycle','Siklus',[{id:'DAILY',name:'Harian'},{id:'WEEKLY',name:'Mingguan'},{id:'MONTHLY',name:'Bulanan'}])}<div class="grid grid-2">${KSB.field('start','Mulai Periode','date','',true)}${KSB.field('end','Akhir Periode','date','',true)}</div>${KSB.field('dueDate','Jatuh Tempo','date','',true)}<button class="btn full">Generate Invoice</button></form><p class="muted small">Invoice mitra tidak menagih ulang fee yang telah dipotong di settlement.</p></div><div class="card"><h3>Riwayat Invoice (${inv.total})</h3>${inv.items.length?inv.items.map(i=>`<div class="row-item"><div class="info"><strong>${KSB.h(i.id)}</strong><div class="small muted">${KSB.h(i.party_type)} · ${KSB.h(i.cycle)}</div><div>${KSB.status(i.status)}</div><div class="small">Sisa: ${KSB.rup(i.balance)}</div></div><div class="grid">${KSB.btn('PDF','downloadInvoice',i.id,'outline')}${Number(i.balance)>0?KSB.btn('Catat Setoran','adminInvoicePay',i.id,''):''}</div></div>`).join(''):KSB.empty('Belum ada invoice')}</div></div>`);}
 if(view==='finance'){const [stats,users]=await Promise.all([KSB.call('admin.dashboard'),KSB.call('admin.users')]);let ps=users.filter(u=>u.roles.some(r=>r==='SELLER'||r==='COURIER'));return KSB.page('Keuangan & Settlement',`<div class="grid grid-2"><div class="stat"><div class="title">Kas Tercatat</div><div class="value">${KSB.rup(stats.cash)}</div></div><div class="stat"><div class="title">Hak Seller</div><div class="value">${KSB.rup(stats.sellerPayable)}</div></div><div class="stat"><div class="title">Hak Kurir</div><div class="value">${KSB.rup(stats.courierPayable)}</div></div><div class="stat"><div class="title">COD Belum Disetor</div><div class="value">${KSB.rup(stats.codOutstanding)}</div></div></div><div class="card" style="margin-top:16px"><h3>Siklus Invoice Mitra</h3><form data-form="billing">${KSB.select('partyId','Mitra',ps.map(x=>({id:x.id,name:x.name+' — '+x.email})))}${KSB.select('partyType','Jenis Mitra',[{id:'SELLER',name:'Seller'},{id:'COURIER',name:'Kurir'}])}${KSB.select('cycle','Siklus',[{id:'DAILY',name:'Harian'},{id:'WEEKLY',name:'Mingguan'},{id:'MONTHLY',name:'Bulanan'}])}<button class="btn full">Simpan Siklus</button></form></div><div class="card" style="margin-top:16px"><h3>Catat Transfer Settlement</h3><p class="muted small">Catat hanya setelah transfer bank benar-benar berhasil dan mutasi terverifikasi.</p><form data-form="settlement">${KSB.select('partyId','Penerima',ps.map(x=>({id:x.id,name:x.name+' — '+x.email})))}${KSB.select('partyType','Jenis',[{id:'SELLER',name:'Seller'},{id:'COURIER',name:'Kurir'}])}${KSB.field('amount','Nilai Transfer (Rp)','number','',true,'min="1" step="1"')}${KSB.field('bankReference','Referensi Transfer Bank','text','',true)}<label class="flex"><input class="check" name="confirmBankRecipient" type="checkbox" required> Saya sudah mentransfer ke rekening mitra yang terverifikasi</label><button class="btn full">Catat Settlement</button></form></div>`);}
 if(view==='settings'){let d=await KSB.call('admin.settings');return KSB.page('Pengaturan Platform',`<div class="aside-split"><div class="card"><h3>Konfigurasi Tarif & Fee</h3>${d.settings.map(s=>`<form data-form="setting" class="row-item"><div class="info"><div class="small strong">${KSB.h(s.key)}</div><input type="hidden" name="key" value="${KSB.h(s.key)}"><input aria-label="${KSB.h(s.key)}" name="value" type="number" min="0" step="1" value="${KSB.h(s.value)}" style="width:100%;max-width:190px;padding:8px;border:1px solid #cdd;border-radius:8px"></div><button class="btn small secondary">Simpan</button></form>`).join('')}</div><div class="card"><h3>Tarif Tetap Zona</h3><div class="notice warn">Fallback resmi saat Routes API gagal. Tanpa tarif zona, checkout ditolak jika API rute tidak tersedia.</div><form data-form="zone">${KSB.select('from','Kecamatan Asal',KSB.districtOptions())}${KSB.select('to','Kecamatan Tujuan',KSB.districtOptions())}${KSB.field('tariff','Tarif Tetap (Rp)','number','',true,'min="1"')}<button class="btn full">Simpan Tarif Zona</button></form><h4>Zona Tersimpan</h4>${d.zones.length?d.zones.map(z=>KSB.cardRow(z.from_district+' → '+z.to_district,KSB.rup(z.fixed_tariff))).join(''):KSB.empty('Belum ada zona tersimpan')}</div></div>`);}
 if(view==='reports'){let d=await KSB.call('admin.reports',{});return KSB.page('Laporan Operasional',`<div class="grid grid-2"><div class="stat"><div class="title">Order</div><div class="value">${d.orderCount}</div></div><div class="stat"><div class="title">Selesai</div><div class="value">${d.completedCount}</div></div><div class="stat"><div class="title">Nilai Order</div><div class="value">${KSB.rup(d.gross)}</div></div><div class="stat"><div class="title">GMV Selesai</div><div class="value">${KSB.rup(d.completedGross)}</div></div></div><h3 class="section-title">Unduh Laporan</h3>${KSB.btn('Ekspor Order CSV','adminExportCSV','','outline')}`);}
 if(view==='disputes'){let d=await KSB.call('admin.disputes',{});return KSB.page('Sengketa / Refund',`${d.items.length?d.items.map(o=>KSB.cardRow(o.id,o.status,KSB.btn('Lihat Order','orderDetail',o.id))).join(''):KSB.empty('Tidak ada sengketa')}<div class="notice warn">Resolusi refund, retur, dan jurnal koreksi memerlukan prosedur manual yang tervalidasi. Jangan melakukan pengembalian uang hanya dengan mengubah status.</div>`);}
 if(view==='account')return KSB.accountView();if(view==='order')return KSB.buyer('order',args);return KSB.empty('Halaman admin tidak ditemukan');
};
KSB.actions.adminClaims=async()=>KSB.goto('claims');
KSB.actions.adminPayouts=async()=>KSB.goto('payouts');
KSB.actions.adminPending=async()=>KSB.goto('pending');KSB.actions.adminPayments=async()=>KSB.goto('payments');KSB.actions.adminOrders=async()=>KSB.goto('orders');KSB.actions.adminFinance=async()=>KSB.goto('finance');KSB.actions.adminInvoices=async()=>KSB.goto('invoices');KSB.actions.adminSettings=async()=>KSB.goto('settings');KSB.actions.adminReports=async()=>KSB.goto('reports');KSB.actions.adminDisputes=async()=>KSB.goto('disputes');
KSB.actions.adminApprove=async el=>KSB.run(async()=>{const [roleId,status]=el.dataset.id.split(':');await KSB.call('admin.approve',{roleId,approve:status==='true'});KSB.toast('Status mitra diperbarui.');await KSB.refresh();});
KSB.actions.adminInvoicePay=async el=>{const id=el.dataset.id;KSB.modal('Catat Setoran COD',`<form data-form="invoicePay"><input type="hidden" name="invoiceId" value="${KSB.h(id)}">${KSB.field('amount','Nominal Setoran Rp','number','',true,'min="1"')}${KSB.field('bankReference','Referensi Mutasi Bank','text','',true)}<label class="flex"><input class="check" name="confirmFunds" type="checkbox" required> Mutasi bank sudah diverifikasi.</label><button class="btn full">Simpan Setoran</button></form>`);};
KSB.actions.adminExportCSV=async()=>KSB.run(async()=>{const d=await KSB.call('admin.reports',{size:40});let rows=[['ID','Status','Tanggal','Total']],items=d.orders.items;items.forEach(o=>rows.push([o.id,o.status,o.created_at,o.grand_total]));const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='ksb-report-page-'+d.orders.page+'.csv';a.click();URL.revokeObjectURL(url);});
KSB.forms.verifyPayment=async form=>KSB.run(async()=>{const f=Object.fromEntries(new FormData(form));if(!f.confirmFunds)throw Error('Periksa dana masuk di aplikasi bank resmi sebelum menyetujui.');await KSB.call('admin.payment.verify',{paymentId:f.paymentId,photoReviewOnly:true,confirmFunds:true,confirmIndependentStatement:true});KSB.closeModal();KSB.toast('Pembayaran diterima. Rekonsiliasi mutasi bank tetap diperlukan.');await KSB.refresh();});
KSB.forms.invoice=async form=>KSB.run(async()=>{const f=Object.fromEntries(new FormData(form));let requestKey=crypto.randomUUID();let r=await KSB.call('admin.invoice.issue',{...f,requestKey});KSB.toast('Invoice diterbitkan: '+r.id);await KSB.refresh();});
KSB.forms.invoicePay=async form=>KSB.run(async()=>{const f=Object.fromEntries(new FormData(form));await KSB.call('admin.invoice.pay',{invoiceId:f.invoiceId,amount:f.amount,bankReference:f.bankReference,confirmFunds:!!f.confirmFunds,requestKey:crypto.randomUUID()});KSB.closeModal();await KSB.refresh();KSB.toast('Setoran COD direkonsiliasi.');});
KSB.actions.adminPayoutDecision=async el=>KSB.run(async()=>{const form=el.closest('form');if(!form||!form.elements.confirmBankOwner.checked)throw Error('Konfirmasi pemeriksaan pemilik rekening terlebih dahulu.');await KSB.call('admin.payout.verify',{id:el.dataset.id,approve:el.dataset.approve==='true',confirmBankOwner:true});KSB.toast('Status rekening mitra diperbarui.');await KSB.refresh();});
KSB.forms.settlement=async form=>KSB.run(async()=>{const f=Object.fromEntries(new FormData(form));await KSB.call('admin.settlement',{...f,confirmBankRecipient:!!f.confirmBankRecipient,requestKey:crypto.randomUUID()});KSB.toast('Settlement tercatat.');await KSB.refresh();});
KSB.forms.setting=async form=>KSB.run(async()=>{await KSB.call('admin.settings.save',Object.fromEntries(new FormData(form)));KSB.toast('Pengaturan disimpan');await KSB.refresh();});
KSB.forms.zone=async form=>KSB.run(async()=>{await KSB.call('admin.zones.save',Object.fromEntries(new FormData(form)));KSB.toast('Tarif zona tersimpan');await KSB.refresh();});
</script>

<script> KSB.forms.billing=async form=>KSB.run(async()=>{await KSB.call('admin.billing.save',Object.fromEntries(new FormData(form)));KSB.toast('Siklus invoice tersimpan.');}); </script>

<script>
KSB.actions.adminProofs=async el=>KSB.run(async()=>{
  const paymentId=el.dataset.id;
  const proofs=await KSB.call('admin.payments.proofs',{paymentId});
  if(!proofs.length)throw Error('Belum ada bukti yang diunggah.');
  const file=await KSB.call('files.read',{attachmentId:proofs[0].attachmentId});
  const isImage=['image/jpeg','image/png'].includes(file.mime);
  let preview='';
  if(isImage){
    preview='<img alt="Bukti transfer dari pembeli, BELUM diverifikasi bank" src="data:'+file.mime+';base64,'+file.base64+'" style="width:100%;max-height:48vh;object-fit:contain;border-radius:10px;border:1px solid #ddd" />';
  } else {
    KSB.download(file);
    preview='<p class="notice">Bukti PDF sedang diunduh. Buka PDF tersebut sebelum menyetujui.</p>';
  }
  const html='<div class="small muted">Foto bukti tidak menjamin uang masuk. Periksa transaksi di aplikasi bank resmi.</div>'+preview+
    '<form data-form="verifyPayment"><input type="hidden" name="paymentId" value="'+KSB.h(paymentId)+'">'+
    '<label class="flex" style="margin:12px 0"><input class="check" type="checkbox" name="confirmFunds" required> Saya telah mengecek aplikasi bank resmi: dana benar-benar masuk, nominal sesuai, dan belum dipakai untuk order lain.</label>'+
    '<button class="btn full" type="submit">Terima Pembayaran</button></form>';
  KSB.modal('Periksa Bukti Transfer',html);
});
</script>

<script>KSB.actions.adminGateway=async()=>KSB.goto('gateway');KSB.forms.gatewayQueue=async form=>KSB.run(async()=>{const o=Object.fromEntries(new FormData(form));await KSB.call('admin.gateway.payout.queue',o);KSB.toast('Payout test masuk antrean.');await KSB.goto('gateway');});</script>

<script>KSB.forms.gatewayBankSettlement=async form=>KSB.run(async()=>{const o=Object.fromEntries(new FormData(form));await KSB.call('admin.gateway.settlement.confirm',{...o,confirmProviderReport:!!o.confirmProviderReport,confirmBankFunds:!!o.confirmBankFunds});KSB.toast('Penerimaan dana gateway dicatat setelah rekonsiliasi.');await KSB.goto('gateway');});</script>
