<script>
/** Marketplace V4 UI; overrides public browsing only, preserves all V3 checkout/payment/delivery handlers. */
(function(){
 const oldBuyer=KSB.buyer;
 KSB.previewOnly=[{name:'Madu Hutan Sumbawa',price:'Contoh katalog',icon:'🍯',tag:'Produk UMKM'},{name:'Kopi Asli Sumbawa',price:'Contoh katalog',icon:'☕',tag:'Minuman'},{name:'Tenun Lokal',price:'Contoh katalog',icon:'🧵',tag:'Fashion'},{name:'Hasil Pertanian Lokal',price:'Contoh katalog',icon:'🌽',tag:'Pertanian'}];
 KSB.icons={home:'⌂',categories:'▦',cart:'🛒',orders:'▤',account:'♙',favorites:'♡',search:'⌕',package:'🚚'};
 KSB.marketDemo=function(){return `<div class="preview-explain">Belum ada produk aktif. Kartu di bawah hanya <strong>contoh desain</strong>, bukan penawaran jual beli.</div><div class="market-products">${KSB.previewOnly.map((p,i)=>`<div class="market-product demo-card"><div class="market-photo demo-photo demo-color-${i}"><span>${p.icon}</span><small>CONTOH TAMPILAN</small></div><div class="market-product-info"><div class="market-prod-name">${KSB.h(p.name)}</div><div class="market-price muted">${KSB.h(p.price)}</div><div class="market-prod-meta">${KSB.h(p.tag)}</div><div class="demo-disabled">Belum tersedia</div></div></div>`).join('')}</div>`;};
 KSB.productCard=function(p){return `<article class="market-product"><button class="market-product-main" type="button" data-action="product" data-id="${KSB.h(p.id)}" aria-label="Detail ${KSB.h(p.name)}"><div class="market-photo">${p.image?`<img loading="lazy" alt="${KSB.h(p.name)}" referrerpolicy="no-referrer" src="${KSB.h(p.image)}">`:'<span>🛍️</span>'}</div><div class="market-product-info"><div class="market-prod-name">${KSB.h(p.name)}</div><div class="market-price">${KSB.rup(p.price)}</div><div class="market-prod-meta">📍 ${KSB.h(KSB.marketDistrict(p.district_id))}</div><div class="market-prod-meta store-line">${KSB.h(p.store_name)}</div><div class="market-rating">${p.rating?`<span>★ ${KSB.h(p.rating)}</span> <span class="muted">(${KSB.h(p.review_count)})</span>`:'<span class="muted">Belum ada ulasan</span>'}</div></div></button><button type="button" class="market-heart" data-action="marketFavorite" data-id="${KSB.h(p.id)}" aria-label="Simpan favorit ${KSB.h(p.name)}">♡</button><div class="ksb-v9-card-actions"><button type="button" class="ksb-v9-add" data-action="marketCardCart" data-id="${KSB.h(p.id)}">+ Keranjang</button><button type="button" class="ksb-v9-buy" data-action="marketCardBuy" data-id="${KSB.h(p.id)}">Beli</button></div></article>`;};
 KSB.marketDistrict=function(id){let d=(KSB.state.config?.districts||[]).find(x=>x.id===id);return d?.name||'Sumbawa Barat';};
 KSB.marketIcons=function(name){return /makanan/i.test(name)?'🍱':/sembako/i.test(name)?'🛒':/pertanian/i.test(name)?'🌱':/elektronik/i.test(name)?'📱':/fashion/i.test(name)?'👕':/rumah/i.test(name)?'🏠':/umkm/i.test(name)?'🎁':'▦';};
 KSB.renderHeader=function(){const s=KSB.state,u=s.user,roles=u?.roles||[];document.getElementById('header').innerHTML=`<div class="market-promo-strip"><div class="market-promo-inner"><span>📍 Melayani 8 kecamatan di Sumbawa Barat</span><span class="desktop-only">Bantu UMKM lokal berkembang bersama KSB GO</span><span>Belanja, Kirim, Lebih Dekat</span></div></div><header class="market-header"><button type="button" data-action="goHome" class="brand-market" aria-label="Beranda KSB GO"><span class="brand-symbol">K</span><span><b>KSB <span class="brand-go">GO</span></b><small>+ KSB RUTE</small></span></button><form data-form="marketSearch" class="market-search"><span aria-hidden="true">⌕</span><input type="search" name="q" aria-label="Cari produk atau toko" placeholder="Cari produk, toko, atau kebutuhanmu" value="${KSB.h(s.args?.q||'')}"><button type="submit" class="market-search-submit">Cari</button></form><div class="market-head-actions"><button data-action="marketFavoritesPage" class="market-head-action" type="button" title="Favorit">♡<span>Favorit</span></button><button data-action="goCart" class="market-head-action" type="button" title="Keranjang">🛒<span>Keranjang</span></button><button data-action="account" class="market-head-action" type="button" title="Akun">${u?'👤':'♙'}<span>${u?'Akun Saya':'Masuk'}</span></button></div></header><div class="market-desktop-nav"><button data-action="goHome" type="button">Beranda</button><button data-action="nav" data-view="categories" type="button">Kategori</button><button data-action="goParcel" type="button">🚚 KSB RUTE</button><button data-action="nav" data-view="orders" type="button">Pesanan Saya</button><span class="nav-grow"></span></div>`;};
 KSB.renderBottom=function(){const role=KSB.state.role,nav=role==='BUYER'?[['home','⌂','Beranda'],['categories','▦','Kategori'],['cart','🛒','Keranjang'],['orders','▤','Pesanan'],['account','♙','Akun']]:role==='SELLER'?[['dashboard','⌂','Beranda'],['products','▣','Produk'],['orders','▤','Pesanan'],['finance','▥','Keuangan'],['account','♙','Akun']]:role==='COURIER'?[['dashboard','⌂','Beranda'],['available','📦','Ambil'],['my','🛵','Kirim'],['finance','▥','Keuangan'],['account','♙','Akun']]:[['dashboard','⌂','Beranda'],['pending','♙','Mitra'],['payments','▤','Transfer'],['invoices','▥','Invoice'],['settings','⚙','Setelan']];document.getElementById('bottom').innerHTML='<nav class="nav market-bottom" aria-label="Menu utama">'+nav.map(n=>`<button type="button" data-action="nav" data-view="${n[0]}" class="${KSB.state.view===n[0]?'active':''}"><span class="nav-icon">${n[1]}</span><span>${n[2]}</span></button>`).join('')+'</nav>';};
 KSB.marketSearchBox=function(args,categories){return `<div class="market-filter-panel"><form data-form="marketFilter" class="market-filter-form"><div class="market-filter-grid"><label><span>Kecamatan</span><select name="district"><option value="">Seluruh wilayah</option>${KSB.districtOptions().map(x=>`<option value="${KSB.h(x.id)}" ${x.id===args.district?'selected':''}>${KSB.h(x.name)}</option>`).join('')}</select></label><label><span>Kategori</span><select name="category"><option value="">Semua kategori</option>${categories.map(c=>`<option value="${KSB.h(c.id)}" ${args.category===c.id?'selected':''}>${KSB.h(c.name)}</option>`).join('')}</select></label><label><span>Urutkan</span><select name="sort"><option value="newest" ${(!args.sort||args.sort==='newest')?'selected':''}>Terbaru</option><option value="price_asc" ${args.sort==='price_asc'?'selected':''}>Harga terendah</option><option value="price_desc" ${args.sort==='price_desc'?'selected':''}>Harga tertinggi</option><option value="rating" ${args.sort==='rating'?'selected':''}>Rating pembeli</option></select></label><label><span>Harga minimum</span><input type="number" min="0" name="minPrice" placeholder="Rp 0" value="${KSB.h(args.minPrice||'')}"></label><label><span>Harga maksimum</span><input type="number" min="0" name="maxPrice" placeholder="Tanpa batas" value="${KSB.h(args.maxPrice||'')}"></label></div><div class="market-filter-actions"><button class="btn" type="submit">Terapkan filter</button><button class="btn outline" data-action="clearFilters" type="button">Reset</button></div></form></div>`;};
 KSB.marketCategories=function(categories){return `<section class="market-section"><div class="market-section-head"><h2>Kategori Pilihan</h2><button data-action="nav" data-view="categories" class="market-text-link" type="button">Lihat semua →</button></div><div class="market-category-grid">${categories.slice(0,8).map(c=>`<button class="market-category" data-action="category" data-id="${KSB.h(c.id)}" type="button"><span>${KSB.marketIcons(c.name)}</span><b>${KSB.h(c.name)}</b></button>`).join('')}</div></section>`;};
 KSB.marketHero=function(){return `<section class="market-hero"><div class="hero-copy"><span class="hero-eyebrow">✦ MARKETPLACE LOKAL SUMBAWA BARAT</span><h1>Dekat tokonya,<br><em>cepat sampainya.</em></h1><p>Belanja produk lokal dan kirim barang antarkecamatan, semuanya melalui KSB GO.</p><div class="hero-buttons"><button data-action="nav" data-view="categories" type="button" class="hero-primary">Mulai Belanja →</button><button data-action="goParcel" type="button" class="hero-secondary">🚚 Kirim Paket</button></div></div><div class="hero-art" aria-hidden="true"><div class="hero-orbit"></div><div class="hero-grocery">🛍️</div><div class="hero-bubble one">🍯</div><div class="hero-bubble two">🌽</div><div class="hero-bubble three">📦</div></div></section>`;};
 KSB.marketResult=function(products,page){return products.items.length?`<div class="market-products">${products.items.map(KSB.productCard).join('')}</div>${products.hasMore?`<div class="market-pagination"><button type="button" class="btn outline" data-action="loadMore">Halaman berikutnya →</button><span>Halaman ${products.page} dari ${Math.ceil(products.total/products.size)}</span></div>`:''}`:KSB.empty('Belum ada produk tersedia','Seller yang sudah terverifikasi dapat menambah produk dari dashboard masing-masing.');};
 KSB.marketHome=async function(view,args){const home=view==='home',a={...args,page:KSB.state.page,size:20};let data=await KSB.call('catalog',a);KSB.state.categories=data.categories;let title=home?'Rekomendasi Produk Lokal':args.q?`Hasil pencarian: ${args.q}`:'Jelajahi Semua Produk';return `${home?KSB.marketHero():`<div class="market-breadcrumb"><button type="button" data-action="goHome">Beranda</button> / Katalog</div><div class="market-title-row"><div><span class="market-kicker">TEMUKAN KEBUTUHANMU</span><h1>${KSB.h(title)}</h1><p class="muted">Cari dari toko lokal yang terdaftar di KSB GO.</p></div></div>`}<div class="market-benefits"><div><span>🏬</span><strong>UMKM Lokal</strong><small>Toko dari Sumbawa Barat</small></div><div><span>🚚</span><strong>KSB RUTE</strong><small>Antar antarwilayah</small></div><div><span>🔐</span><strong>Pembayaran Aman</strong><small>Konfirmasi dari sistem</small></div><div><span>💬</span><strong>Chat Penjual</strong><small>Melalui WhatsApp</small></div></div>${home?KSB.marketCategories(data.categories):''}<section class="market-section"><div class="market-section-head"><div><span class="market-kicker">${home?'PILIHAN UNTUK ANDA':'HASIL PENCARIAN'}</span><h2>${KSB.h(title)}</h2></div><span class="market-count">${data.products.total} produk</span></div>${KSB.marketSearchBox(args,data.categories)}${data.products.total?KSB.marketResult(data.products):home?KSB.marketDemo():KSB.marketResult(data.products)}</section><section class="market-rute-banner"><span class="rute-illustration">🚚</span><div><strong>Ada paket yang perlu dikirim?</strong><p>Gunakan layanan KSB RUTE untuk pengiriman lokal dan antarkecamatan.</p></div><button class="btn blue" type="button" data-action="goParcel">Kirim Paket →</button></section>`;};
 KSB.marketStore=async function(args){const d=await KSB.call('market.store',{id:args.id,page:KSB.state.page,size:20,q:args.q||'',sort:args.sort||'newest'}),s=d.store;return `<div class="market-breadcrumb"><button data-action="goHome" type="button">Beranda</button> / Toko / ${KSB.h(s.name)}</div><section class="store-cover"><div class="store-avatar">🏬</div><div class="store-about"><span class="market-kicker">TOKO LOKAL KSB GO</span><h1>${KSB.h(s.name)}</h1><p>${KSB.h(s.description||'Belanja kebutuhan Anda di toko lokal.')}</p><p>📍 ${KSB.h(s.district)} · ${KSB.h(s.address)}</p><p>🕘 ${KSB.h(s.opening_time)}–${KSB.h(s.closing_time)} WITA</p></div>${s.whatsapp?`<a class="btn store-whatsapp" target="_blank" rel="noopener noreferrer" href="${KSB.h(KSB.waLink(s.whatsapp,'Halo '+s.name+', saya menghubungi dari KSB GO.'))}">💬 Chat via WhatsApp</a>`:''}</section><section class="market-section"><div class="market-section-head"><h2>Produk dari ${KSB.h(s.name)}</h2><span class="market-count">${d.products.total} produk</span></div>${KSB.marketResult(d.products)}</section>`;};
 KSB.marketProduct=async function(args){const p=await KSB.call('product.detail',{id:args.id}),reviews=await KSB.call('market.reviews',{productId:args.id,page:1,size:6});const primary=p.images[0]||'';return `<div class="market-breadcrumb"><button type="button" data-action="goHome">Beranda</button> / <button type="button" data-action="marketStore" data-id="${KSB.h(p.store.id)}">${KSB.h(p.store.name)}</button> / ${KSB.h(p.name)}</div><div class="market-product-layout"><div class="market-detail-gallery"><div class="market-detail-photo" id="market-main-photo">${primary?`<img src="${KSB.h(primary)}" alt="${KSB.h(p.name)}">`:'<span>🛍️</span>'}</div>${p.images.length>1?`<div class="market-gallery-thumbs">${p.images.map((src,i)=>`<button type="button" class="${i===0?'selected':''}" data-action="marketGallery" data-src="${KSB.h(src)}" aria-label="Foto produk ${i+1}"><img src="${KSB.h(src)}" alt="Foto ${i+1}" loading="lazy"></button>`).join('')}</div>`:''}</div><div class="market-detail-main"><span class="pill">Produk UMKM lokal</span><h1>${KSB.h(p.name)}</h1><div class="market-review-indicator">${reviews.average?`<span class="star-rating">★ ${KSB.h(reviews.average)}</span> · ${reviews.total} ulasan`:'Belum ada ulasan pembeli'}</div><div class="market-detail-price">${KSB.rup(p.price)}</div><div class="market-detail-divider"></div><h3>Detail Produk</h3><p class="market-stock">📦 Stok tersedia: <strong>${KSB.h(p.stock)}</strong></p><p class="market-description">${KSB.h(p.description||'Penjual belum menambahkan deskripsi untuk produk ini.')}</p><div class="market-detail-divider"></div><button type="button" class="market-store-link" data-action="marketStore" data-id="${KSB.h(p.store.id)}"><span class="store-badge">🏬</span><span><strong>${KSB.h(p.store.name)}</strong><small>${KSB.h(KSB.marketDistrict(p.store.district_id))} · Lihat toko →</small></span></button>${p.store.whatsapp?`<a class="market-chat-link" href="${KSB.h(KSB.waLink(p.store.whatsapp,'Halo '+p.store.name+', saya ingin bertanya tentang produk '+p.name+' di KSB GO.'))}" target="_blank" rel="noopener noreferrer">💬 Chat penjual melalui WhatsApp</a>`:''}</div><aside class="market-buy-box"><strong>Atur jumlah pembelian</strong><div class="market-mini-product"><div class="market-mini-emoji">🛍</div><span>${KSB.h(p.name)}</span></div><div class="market-qty"><button type="button" data-action="marketQty" data-delta="-1" aria-label="Kurangi jumlah">−</button><input id="product-qty" type="number" aria-label="Jumlah pembelian" min="1" max="${Number(p.stock)}" value="1"><button type="button" data-action="marketQty" data-delta="1" aria-label="Tambah jumlah">+</button><span>Stok: ${KSB.h(p.stock)}</span></div><div class="market-detail-total"><span>Subtotal</span><strong id="market-subtotal">${KSB.rup(p.price)}</strong></div><div class="market-buy-actions"><button class="btn outline" data-action="addCart" data-id="${KSB.h(p.id)}" type="button">+ Keranjang</button><button class="btn" data-action="buyNow" data-id="${KSB.h(p.id)}" type="button">Beli Langsung</button></div><button type="button" class="market-quiet-btn" data-action="marketFavorite" data-id="${KSB.h(p.id)}">♡ Simpan ke favorit</button><small class="muted">Ongkir final dihitung saat checkout sesuai rute/zona admin.</small></aside></div><section class="market-section review-section"><div class="market-section-head"><h2>Ulasan Pembeli</h2><span class="market-count">${reviews.total} ulasan terverifikasi</span></div>${reviews.reviews.items.length?reviews.reviews.items.map(r=>`<div class="review-card"><strong>${KSB.h(r.buyer_name)}</strong><span class="star-rating">${'★'.repeat(r.rating)}</span><small class="muted">${KSB.date(r.created_at)}</small><p>${KSB.h(r.comment||'Pembeli memberikan rating.')}</p></div>`).join(''):'<div class="market-no-reviews">Belum ada ulasan. Pembeli dapat mengulas setelah pesanan dibayar dan diterima.</div>'}</section><script type="application/json" id="market-detail-data">${JSON.stringify({price:p.price,stock:p.stock}).replace(/</g,'\\u003c')}<\/script>`;};
 KSB.marketFavorites=async function(){if(!KSB.needLogin())return KSB.accountView();let data=await KSB.call('market.favorites');return `<div class="market-title-row"><h1>♡ Produk Favorit</h1><p class="muted">Produk yang Anda simpan untuk dilihat kembali.</p></div>${data.items.length?`<div class="market-products">${data.items.map(KSB.productCard).join('')}</div>`:KSB.empty('Belum ada produk favorit','Tekan ikon hati pada produk untuk menyimpannya.',KSB.btn('Cari Produk','goHome','','outline'))}`;};
 KSB.buyer=async function(view,args){if(view==='home'||view==='categories')return KSB.marketHome(view,args||{});if(view==='store')return KSB.marketStore(args);if(view==='product')return KSB.marketProduct(args);if(view==='favorites')return KSB.marketFavorites();if(view==='review'){if(!KSB.needLogin())return KSB.accountView();let d=await KSB.call('order.detail',{id:args.id});if(d.order.status!=='DELIVERED'||d.order.payment_status!=='PAID')return KSB.empty('Ulasan belum tersedia','Ulasan hanya untuk pesanan yang sudah dibayar dan selesai.');return KSB.page('Beri Ulasan Produk',d.items.map(i=>`<form class="card" data-form="marketReview"><h3>${KSB.h(i.name)}</h3><input type="hidden" name="orderItemId" value="${KSB.h(i.id)}"><div class="field"><label>Nilai produk</label><select name="rating" required><option value="5">★★★★★ — Sangat baik</option><option value="4">★★★★ — Baik</option><option value="3">★★★ — Cukup</option><option value="2">★★ — Kurang</option><option value="1">★ — Buruk</option></select></div><div class="field"><label>Pengalaman belanja (opsional)</label><textarea name="comment" maxlength="750" placeholder="Tulis ulasan jujur..."></textarea></div><button class="btn" type="submit">Kirim ulasan</button></form>`).join(''));}const base=await oldBuyer(view,args);return view==='order'?base+`<div class="market-review-cta"><button class="btn outline" data-action="marketReviewOrder" data-id="${KSB.h(args.id)}">★ Beri Ulasan Produk</button></div>`:base;};
 KSB.actions.marketCardCart=async el=>{if(!KSB.needLogin())return;await KSB.run(async()=>{await KSB.call('cart.add',{product_id:el.dataset.id,quantity:1});KSB.toast('Produk berhasil dimasukkan ke keranjang.');});};
 KSB.actions.marketCardBuy=async el=>{if(!KSB.needLogin())return;await KSB.run(async()=>{const cart=await KSB.call('cart.add',{product_id:el.dataset.id,quantity:1});const item=(cart.items||[]).find(x=>x.product_id===el.dataset.id);if(item){KSB.state.selectedItems=new Set([item.id]);KSB.state.cartSelectionInitialized=true;}await KSB.goto(item?'checkout':'cart');});};
 KSB.actions.marketStore=async el=>KSB.goto('store',{id:el.dataset.id});
 KSB.actions.marketFavoritesPage=async()=>KSB.goto('favorites');
 KSB.actions.marketFavorite=async el=>{if(!KSB.needLogin())return;await KSB.run(async()=>{let out=await KSB.call('market.favorite.toggle',{productId:el.dataset.id});KSB.toast(out.favorite?'Ditambahkan ke favorit':'Dihapus dari favorit');if(KSB.state.view==='favorites')await KSB.refresh();else if(el.classList.contains('market-heart')){el.textContent=out.favorite?'♥':'♡';el.classList.toggle('favorited',out.favorite);}});};
 KSB.actions.marketQty=async el=>{const input=document.getElementById('product-qty');if(!input)return;const max=Number(input.max)||999;input.value=String(Math.max(1,Math.min(max,(Number(input.value)||1)+Number(el.dataset.delta))));input.dispatchEvent(new Event('input',{bubbles:true}));};
 KSB.actions.marketGallery=async el=>{const img=document.querySelector('#market-main-photo img');if(img)img.src=el.dataset.src;document.querySelectorAll('.market-gallery-thumbs button').forEach(b=>b.classList.toggle('selected',b===el));};
 KSB.actions.marketReviewOrder=async el=>KSB.goto('review',{id:el.dataset.id});
 KSB.forms.marketSearch=async form=>KSB.goto('categories',{q:form.elements.q.value.trim()});
 KSB.forms.marketFilter=async form=>{const f=Object.fromEntries(new FormData(form));await KSB.goto('categories',{...f,q:KSB.state.args.q||''});};
 KSB.forms.marketReview=async form=>KSB.run(async()=>{let f=Object.fromEntries(new FormData(form));await KSB.call('market.review.submit',f);KSB.toast('Terima kasih, ulasan disimpan.');await KSB.goto('orders');});
 document.addEventListener('input',ev=>{if(ev.target.id==='product-qty'){const json=document.getElementById('market-detail-data');if(!json)return;try{const d=JSON.parse(json.textContent);const n=Math.max(1,Math.min(Number(d.stock),(Number(ev.target.value)||1)));document.getElementById('market-subtotal').textContent=KSB.rup(Number(d.price)*n);}catch(ex){}}});
})();
</script>
